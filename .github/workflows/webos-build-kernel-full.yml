name: Build LG kernel (webOS 6.0 source)

on:
  workflow_dispatch:
    inputs:
      map_only:
        description: "Only download, unpack and print the map (no build)"
        type: boolean
        default: false
      kernel_dir:
        description: "Kernel root relative to the unpacked tree (blank = auto-detect)"
        type: string
        default: ""
      defconfig:
        description: "make <name> (blank = use tv-kernel.config from this repo)"
        type: string
        default: ""
      arch:
        description: "ARCH for make"
        type: string
        default: "arm64"
      kdrv_platform:
        description: "KDRV_PLATFORM_CFG (a dir under kdriver/platform/, e.g. e60_webos_udtv or o20_webos_udtv)"
        type: string
        default: "o20_webos_udtv"
      skip_kdriver:
        description: "Drop LG's lg_kdriver SoC drivers from the build (they don't compile; not needed for headers/Module.symvers)"
        type: boolean
        default: true
      targets:
        description: "make targets"
        type: string
        default: "Image modules"

permissions:
  contents: read

env:
  # vermagic of the modules on the TV (tv-module-metadata.txt); uname -r has a suffix, vermagic does not
  TV_VERMAGIC: "4.4.84 SMP preempt mod_unload aarch64"
  TOOLCHAIN_ID: 1Oe0g49VU2mARleb6utWjI95FHMIQqOku
  KERNEL_ID: 1i-7Ww5bLLqxItwrAUMl5d5ZfFnPGUqC2

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Check out repo (tv-kernel.config, scripts/)
        uses: actions/checkout@v4

      - name: Free disk space (nested tars need a lot)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex make git libelf-dev libssl-dev perl python3 \
            python3-pip tar xz-utils unzip kmod file cpio rsync gcc-9 g++-9 lzop u-boot-tools device-tree-compiler
          python3 -m pip install --user gdown

      - name: Download toolchain + kernel source from Google Drive
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dl"
          "$HOME/.local/bin/gdown" "$TOOLCHAIN_ID" -O "$RUNNER_TEMP/dl/toolchain.tar.gz"
          "$HOME/.local/bin/gdown" "$KERNEL_ID"    -O "$RUNNER_TEMP/dl/webos-kernel.tar.gz"
          ls -l "$RUNNER_TEMP/dl"
          file "$RUNNER_TEMP/dl"/*

      - name: Install LG SDK toolchain (self-extracting installer inside the tar)
        run: |
          set -euo pipefail
          sdk=starfish-sdk-x86_64-aarch64-toolchain-5.0.0-20191125.sh
          tar -xzf "$RUNNER_TEMP/dl/toolchain.tar.gz" -C "$RUNNER_TEMP/dl" \
            "toolchain/$sdk" toolchain/README.txt toolchain/setup.sh
          rm -f "$RUNNER_TEMP/dl/toolchain.tar.gz"
          echo "== README.txt"; cat "$RUNNER_TEMP/dl/toolchain/README.txt"
          chmod +x "$RUNNER_TEMP/dl/toolchain/$sdk"
          "$RUNNER_TEMP/dl/toolchain/$sdk" -y -d "$RUNNER_TEMP/tc"
          echo "== compilers found"
          find "$RUNNER_TEMP/tc" \( -type f -o -type l \) -name '*-gcc' -printf '%p\n'
          df -h /

      - name: Stream the kernel out of the nested tars and print its map
        run: |
          set -euo pipefail
          # outer -> soc/E_webOS_6.0.tgz -> GPL_2.0/kdriver.tgz -> kdriver/kernel/linux-4.4-lg115x.tgz
          tar -xOf "$RUNNER_TEMP/dl/webos-kernel.tar.gz" soc/E_webOS_6.0.tgz \
            | tar -xzOf - webOS6.0_SIC_E60_Opensource/GPL_2.0/kdriver.tgz \
            > "$RUNNER_TEMP/dl/kdriver.tgz"
          rm -f "$RUNNER_TEMP/dl/webos-kernel.tar.gz"
          ls -l "$RUNNER_TEMP/dl/kdriver.tgz"
          # kernel tgz + LG's kdriver tree (drivers/lg_kdriver) + LG's make settings
          kd="$RUNNER_TEMP/kd"; mkdir -p "$kd"
          tar -xzf "$RUNNER_TEMP/dl/kdriver.tgz" -C "$kd" \
            kdriver/kdriver kdriver/kernel/linux-4.4-lg115x.tgz
          tar -xzf "$RUNNER_TEMP/dl/kdriver.tgz" -C "$kd" --wildcards 'kdriver/*.inc' || true
          rm -f "$RUNNER_TEMP/dl/kdriver.tgz"
          echo "== LG's cmn_def.inc (KERNEL_DEFCONFIG, CROSS_COMPILE, ...)"
          grep -vE '^\s*#|^\s*$' "$kd"/kdriver/*.inc || true
          echo "KDRIVER_DIR=$kd/kdriver/kdriver" >> "$GITHUB_ENV"
          bash scripts/lg-unpack-map.sh "$kd/kdriver/kernel/linux-4.4-lg115x.tgz" "$RUNNER_TEMP/src"
          df -h /

      - name: Upload the map
        uses: actions/upload-artifact@v4
        with:
          name: lg-maps
          path: ${{ runner.temp }}/src.map.txt

      - name: Locate kernel root and cross compiler
        if: ${{ !inputs.map_only }}
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/src"
          if [ -n "${{ inputs.kernel_dir }}" ]; then
            kroot="$src/${{ inputs.kernel_dir }}"
          else
            n=$(wc -l < "$src/.kernel_roots")
            if [ "$n" -ne 1 ]; then
              echo "::error::Found $n kernel roots; rerun with the kernel_dir input. Candidates:"
              cat "$src/.kernel_roots"; exit 1
            fi
            kroot="$(cat "$src/.kernel_roots")"
          fi
          [ -f "$kroot/Makefile" ] || { echo "::error::no Makefile in $kroot"; exit 1; }
          # Same as LG's kernel/Makefile "config" target: drivers/lg_kdriver -> kdriver/kdriver
          rm -rf "$kroot/drivers/lg_kdriver"
          ln -s "$KDRIVER_DIR" "$kroot/drivers/lg_kdriver"
          ls "$kroot/drivers/lg_kdriver/core/Makefile"
          if [ "${{ inputs.skip_kdriver }}" = "true" ]; then
            sed -i '/lg_kdriver/d' "$kroot/drivers/Makefile"
            grep -n lg_kdriver "$kroot/drivers/Makefile" || echo "lg_kdriver removed from drivers/Makefile"
          fi
          gcc="$(find "$RUNNER_TEMP/tc" \( -type f -o -type l \) -name '*-gcc' | grep -E 'aarch64|arm64' | head -1)"
          [ -n "$gcc" ] || { echo "::error::no aarch64 gcc found in toolchain"; exit 1; }
          cross="${gcc%gcc}"
          ls "$KDRIVER_DIR/platform/${{ inputs.kdrv_platform }}" > /dev/null
          echo "KDRV_PLATFORM_CFG=${{ inputs.kdrv_platform }}" >> "$GITHUB_ENV"
          echo "KROOT=$kroot"       >> "$GITHUB_ENV"
          echo "CROSS=$cross"       >> "$GITHUB_ENV"
          echo "$(dirname "$gcc")"  >> "$GITHUB_PATH"
          echo "kernel root: $kroot"; echo "cross prefix: $cross"
          "${cross}gcc" --version | head -1

      - name: Configure
        if: ${{ !inputs.map_only }}
        run: |
          set -euo pipefail
          cd "$KROOT"
          M="make ARCH=${{ inputs.arch }} CROSS_COMPILE=$CROSS HOSTCC=gcc-9"
          $M mrproper            # drop whatever "prepared" leftovers LG shipped
          if [ -n "${{ inputs.defconfig }}" ]; then
            $M "${{ inputs.defconfig }}"
          else
            cp "$GITHUB_WORKSPACE/tv-kernel.config" .config
          fi
          # The TV's modules carry plain "4.4.84" in vermagic, so LOCALVERSION must stay empty.
          scripts/config --set-str LOCALVERSION "" --disable LOCALVERSION_AUTO
          $M olddefconfig
          grep -E '^CONFIG_(PM|SMP|PREEMPT|MODULES|MODVERSIONS|CFG80211|USB|LOCALVERSION)' .config || true
          echo "kernel release: $($M -s kernelrelease 2>/dev/null | tail -1)  (modules on the TV: $TV_VERMAGIC)"

      - name: Build
        if: ${{ !inputs.map_only }}
        run: |
          cd "$KROOT"
          make -k -j"$(nproc)" ARCH=${{ inputs.arch }} CROSS_COMPILE="$CROSS" HOSTCC=gcc-9 \
            KCFLAGS="-Wno-error" ${{ inputs.targets }} 2>&1 | tee "$RUNNER_TEMP/kernel-build.log"
          echo "make exit: ${PIPESTATUS[0]}"
          grep -E ' error[: ]|\*\*\*' "$RUNNER_TEMP/kernel-build.log" | head -60 || true
          ls -l arch/${{ inputs.arch }}/boot/Image* vmlinux
          ko="$(find . -name '*.ko' | head -1)"
          if [ -n "$ko" ]; then
            vm="$(modinfo -F vermagic "$ko")"; echo "vermagic: $vm"
            [ "$vm" = "$TV_VERMAGIC" ] || echo "::warning::vermagic '$vm' != TV '$TV_VERMAGIC'"
          fi

      - name: Collect output
        if: ${{ !inputs.map_only }}
        run: |
          set -euo pipefail
          cd "$KROOT"
          mkdir -p "$GITHUB_WORKSPACE/out/modules"
          cp .config                          "$GITHUB_WORKSPACE/out/kernel.config"
          cp System.map Module.symvers        "$GITHUB_WORKSPACE/out/" || true
          cp include/config/kernel.release    "$GITHUB_WORKSPACE/out/" || true
          cp arch/${{ inputs.arch }}/boot/Image* "$GITHUB_WORKSPACE/out/" || true
          cp "$RUNNER_TEMP/kernel-build.log"  "$GITHUB_WORKSPACE/out/"
          make ARCH=${{ inputs.arch }} CROSS_COMPILE="$CROSS" HOSTCC=gcc-9 \
            INSTALL_MOD_PATH="$GITHUB_WORKSPACE/out/modules" INSTALL_MOD_STRIP=1 modules_install || true
          # Tree for building out-of-tree modules later (no objects)
          cd "$(dirname "$KROOT")"
          tar --exclude='*.o' --exclude='*.a' --exclude='.git' \
            -cJf "$GITHUB_WORKSPACE/out/kernel-tree-for-modules.tar.xz" "$(basename "$KROOT")"
          ls -lh "$GITHUB_WORKSPACE/out"

      - name: Upload kernel output
        if: ${{ !inputs.map_only }}
        uses: actions/upload-artifact@v4
        with:
          name: lg-kernel
          path: out/
          if-no-files-found: error

      - name: Collect build errors (runs even when the build fails)
        if: ${{ always() && !inputs.map_only }}
        run: |
          set +e
          log="$RUNNER_TEMP/kernel-build.log"
          mkdir -p errors
          [ -f "$log" ] || { echo "no build log (failed before make)"; exit 0; }
          grep -E ' error: |fatal error|undefined reference|No rule to make target|\*\*\* ' "$log" > errors/all-errors.txt
          grep -oE '^[^ ]+\.[chS]:[0-9]+:[0-9]+: error: .*' "$log" > errors/compile-errors.txt
          grep -n -m1 -B8 -A12 -E ' error: |No rule to make target' "$log" > errors/first-error.txt
          grep 'No rule to make target' "$log" | sort -u > errors/missing-targets.txt
          grep -oE '\*\*\* \[[^]]*\]' "$log" | sort -u > errors/failed-targets.txt
          sed -E 's/:[0-9]+:[0-9]+: error:.*//' errors/compile-errors.txt | sort | uniq -c | sort -rn > errors/by-file.txt
          sed -E 's/:[0-9]+:[0-9]+: error:.*//; s|/[^/]*$||' errors/compile-errors.txt | sort | uniq -c | sort -rn > errors/by-dir.txt
          sed -E 's/^[^:]+:[0-9]+:[0-9]+: error: //' errors/compile-errors.txt \
            | sed -E "s/'[^']*'/'X'/g" | sort | uniq -c | sort -rn | head -40 > errors/by-message.txt
          grep -c ' warning: ' "$log" > errors/warning-count.txt
          tail -150 "$log" > errors/tail.txt
          gzip -c "$log" > errors/kernel-build.log.gz
          cp "$KROOT/.config" errors/dot-config 2>/dev/null
          {
            echo "### Kernel build errors"
            echo "compile errors: $(wc -l < errors/compile-errors.txt), failed targets: $(wc -l < errors/failed-targets.txt), missing make rules: $(wc -l < errors/missing-targets.txt)"
            echo; echo "#### Errors by directory"; echo '```'; head -15 errors/by-dir.txt; echo '```'
            echo "#### Most common messages"; echo '```'; head -15 errors/by-message.txt; echo '```'
            echo "#### Missing make rules"; echo '```'; head -10 errors/missing-targets.txt; echo '```'
            echo "#### First error in context"; echo '```'; head -40 errors/first-error.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          ls -l errors

      - name: Upload build errors
        if: ${{ always() && !inputs.map_only }}
        uses: actions/upload-artifact@v4
        with:
          name: build-errors
          path: errors/
          if-no-files-found: ignore
