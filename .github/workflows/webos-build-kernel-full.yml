name: Build LG kernel (webOS 6.0 source)

on:
  workflow_dispatch:
    inputs:
      map_only:
        description: "Only download, unpack and print the map (no build)"
        type: boolean
        default: false
      kernel_dir:
        description: "Kernel root relative to the unpacked tree (blank = auto-detect)"
        type: string
        default: ""
      defconfig:
        description: "make <name> (blank = use tv-kernel.config from this repo)"
        type: string
        default: ""
      arch:
        description: "ARCH for make"
        type: string
        default: "arm64"
      kdrv_platform:
        description: "KDRV_PLATFORM_CFG (a dir under kdriver/platform/, e.g. e60_webos_udtv or o20_webos_udtv)"
        type: string
        default: "o20_webos_udtv"
      skip_kdriver:
        description: "Drop LG's lg_kdriver SoC drivers from the build (they don't compile; not needed for headers/Module.symvers)"
        type: boolean
        default: true
      targets:
        description: "make targets"
        type: string
        default: "Image modules"

permissions:
  contents: read

env:
  # vermagic of the modules on the TV (tv-module-metadata.txt); uname -r has a suffix, vermagic does not
  TV_VERMAGIC: "4.4.84 SMP preempt mod_unload aarch64"
  # Pinned tip of aircrack-ng/rtl8812au branch v5.6.4.2 (2026-03-17).
  DRIVER_REPO: https://github.com/aircrack-ng/rtl8812au.git
  DRIVER_SHA: 734485506a30d6237c2deaad666a19f8ca5379f2
  TOOLCHAIN_ID: 1Oe0g49VU2mARleb6utWjI95FHMIQqOku
  KERNEL_ID: 1i-7Ww5bLLqxItwrAUMl5d5ZfFnPGUqC2

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Check out repo (tv-kernel.config, scripts/)
        uses: actions/checkout@v4

      - name: Free disk space (nested tars need a lot)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex make git libelf-dev libssl-dev perl python3 \
            python3-pip tar xz-utils zstd unzip kmod file cpio rsync gcc-9 g++-9 lzop u-boot-tools device-tree-compiler
          python3 -m pip install --user gdown

      - name: Download toolchain + kernel source from Google Drive
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dl"
          "$HOME/.local/bin/gdown" "$TOOLCHAIN_ID" -O "$RUNNER_TEMP/dl/toolchain.tar.gz"
          "$HOME/.local/bin/gdown" "$KERNEL_ID"    -O "$RUNNER_TEMP/dl/webos-kernel.tar.gz"
          ls -l "$RUNNER_TEMP/dl"
          file "$RUNNER_TEMP/dl"/*

      - name: Install LG SDK toolchain (self-extracting installer inside the tar)
        run: |
          set -euo pipefail
          sdk=starfish-sdk-x86_64-aarch64-toolchain-5.0.0-20191125.sh
          tar -xzf "$RUNNER_TEMP/dl/toolchain.tar.gz" -C "$RUNNER_TEMP/dl" \
            "toolchain/$sdk" toolchain/README.txt toolchain/setup.sh
          rm -f "$RUNNER_TEMP/dl/toolchain.tar.gz"
          echo "== README.txt"; cat "$RUNNER_TEMP/dl/toolchain/README.txt"
          chmod +x "$RUNNER_TEMP/dl/toolchain/$sdk"
          "$RUNNER_TEMP/dl/toolchain/$sdk" -y -d "$RUNNER_TEMP/tc"
          echo "== compilers found"
          find "$RUNNER_TEMP/tc" \( -type f -o -type l \) -name '*-gcc' -printf '%p\n'
          df -h /

      - name: Stream the kernel out of the nested tars and print its map
        run: |
          set -euo pipefail
          # outer -> soc/E_webOS_6.0.tgz -> GPL_2.0/kdriver.tgz -> kdriver/kernel/linux-4.4-lg115x.tgz
          tar -xOf "$RUNNER_TEMP/dl/webos-kernel.tar.gz" soc/E_webOS_6.0.tgz \
            | tar -xzOf - webOS6.0_SIC_E60_Opensource/GPL_2.0/kdriver.tgz \
            > "$RUNNER_TEMP/dl/kdriver.tgz"
          rm -f "$RUNNER_TEMP/dl/webos-kernel.tar.gz"
          ls -l "$RUNNER_TEMP/dl/kdriver.tgz"
          # kernel tgz + LG's kdriver tree (drivers/lg_kdriver) + LG's make settings
          kd="$RUNNER_TEMP/kd"; mkdir -p "$kd"
          tar -xzf "$RUNNER_TEMP/dl/kdriver.tgz" -C "$kd" \
            kdriver/kdriver kdriver/kernel/linux-4.4-lg115x.tgz
          tar -xzf "$RUNNER_TEMP/dl/kdriver.tgz" -C "$kd" --wildcards 'kdriver/*.inc' || true
          rm -f "$RUNNER_TEMP/dl/kdriver.tgz"
          echo "== LG's cmn_def.inc (KERNEL_DEFCONFIG, CROSS_COMPILE, ...)"
          grep -vE '^\s*#|^\s*$' "$kd"/kdriver/*.inc || true
          echo "KDRIVER_DIR=$kd/kdriver/kdriver" >> "$GITHUB_ENV"
          bash scripts/lg-unpack-map.sh "$kd/kdriver/kernel/linux-4.4-lg115x.tgz" "$RUNNER_TEMP/src"
          df -h /

      - name: Upload the map
        uses: actions/upload-artifact@v4
        with:
          name: lg-maps
          path: ${{ runner.temp }}/src.map.txt

      - name: Locate kernel root and cross compiler
        if: ${{ !inputs.map_only }}
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/src"
          if [ -n "${{ inputs.kernel_dir }}" ]; then
            kroot="$src/${{ inputs.kernel_dir }}"
          else
            n=$(wc -l < "$src/.kernel_roots")
            if [ "$n" -ne 1 ]; then
              echo "::error::Found $n kernel roots; rerun with the kernel_dir input. Candidates:"
              cat "$src/.kernel_roots"; exit 1
            fi
            kroot="$(cat "$src/.kernel_roots")"
          fi
          [ -f "$kroot/Makefile" ] || { echo "::error::no Makefile in $kroot"; exit 1; }
          # Same as LG's kernel/Makefile "config" target: drivers/lg_kdriver -> kdriver/kdriver
          rm -rf "$kroot/drivers/lg_kdriver"
          ln -s "$KDRIVER_DIR" "$kroot/drivers/lg_kdriver"
          ls "$kroot/drivers/lg_kdriver/core/Makefile"
          if [ "${{ inputs.skip_kdriver }}" = "true" ]; then
            sed -i '/lg_kdriver/d' "$kroot/drivers/Makefile"
            grep -n lg_kdriver "$kroot/drivers/Makefile" || echo "lg_kdriver removed from drivers/Makefile"
          fi
          gcc="$(find "$RUNNER_TEMP/tc" \( -type f -o -type l \) -name '*-gcc' | grep -E 'aarch64|arm64' | head -1)"
          [ -n "$gcc" ] || { echo "::error::no aarch64 gcc found in toolchain"; exit 1; }
          cross="${gcc%gcc}"
          ls "$KDRIVER_DIR/platform/${{ inputs.kdrv_platform }}" > /dev/null
          echo "KDRV_PLATFORM_CFG=${{ inputs.kdrv_platform }}" >> "$GITHUB_ENV"
          echo "KROOT=$kroot"       >> "$GITHUB_ENV"
          echo "CROSS=$cross"       >> "$GITHUB_ENV"
          echo "$(dirname "$gcc")"  >> "$GITHUB_PATH"
          echo "kernel root: $kroot"; echo "cross prefix: $cross"
          "${cross}gcc" --version | head -1

      - name: Configure
        if: ${{ !inputs.map_only }}
        run: |
          set -euo pipefail
          cd "$KROOT"
          M="make ARCH=${{ inputs.arch }} CROSS_COMPILE=$CROSS HOSTCC=gcc-9"
          $M mrproper            # drop whatever "prepared" leftovers LG shipped
          if [ -n "${{ inputs.defconfig }}" ]; then
            $M "${{ inputs.defconfig }}"
          else
            cp "$GITHUB_WORKSPACE/tv-kernel.config" .config
          fi
          # The TV's modules carry plain "4.4.84" in vermagic, so LOCALVERSION must stay empty.
          scripts/config --set-str LOCALVERSION "" --disable LOCALVERSION_AUTO
          $M olddefconfig
          grep -E '^CONFIG_(PM|SMP|PREEMPT|MODULES|MODVERSIONS|CFG80211|USB|LOCALVERSION)' .config || true
          echo "kernel release: $($M -s kernelrelease 2>/dev/null | tail -1)  (modules on the TV: $TV_VERMAGIC)"

      - name: Build
        if: ${{ !inputs.map_only }}
        run: |
          cd "$KROOT"
          make -k -j"$(nproc)" ARCH=${{ inputs.arch }} CROSS_COMPILE="$CROSS" HOSTCC=gcc-9 \
            KCFLAGS="-Wno-error" ${{ inputs.targets }} 2>&1 | tee "$RUNNER_TEMP/kernel-build.log"
          echo "make exit: ${PIPESTATUS[0]}"
          grep -E ' error[: ]|\*\*\*' "$RUNNER_TEMP/kernel-build.log" | head -60 || true
          ls -l arch/${{ inputs.arch }}/boot/Image* vmlinux
          ko="$(find . -name '*.ko' | head -1)"
          if [ -n "$ko" ]; then
            vm="$(modinfo -F vermagic "$ko")"; echo "vermagic: $vm"
            [ "$vm" = "$TV_VERMAGIC" ] || echo "::warning::vermagic '$vm' != TV '$TV_VERMAGIC'"
          fi

      - name: Collect output
        if: ${{ !inputs.map_only }}
        run: |
          set -euo pipefail
          cd "$KROOT"
          mkdir -p "$GITHUB_WORKSPACE/out/modules"
          cp .config                          "$GITHUB_WORKSPACE/out/kernel.config"
          cp System.map Module.symvers        "$GITHUB_WORKSPACE/out/" || true
          cp include/config/kernel.release    "$GITHUB_WORKSPACE/out/" || true
          cp arch/${{ inputs.arch }}/boot/Image* "$GITHUB_WORKSPACE/out/" || true
          cp "$RUNNER_TEMP/kernel-build.log"  "$GITHUB_WORKSPACE/out/"
          make ARCH=${{ inputs.arch }} CROSS_COMPILE="$CROSS" HOSTCC=gcc-9 \
            INSTALL_MOD_PATH="$GITHUB_WORKSPACE/out/modules" INSTALL_MOD_STRIP=1 modules_install || true
          # these symlinks point at the whole kernel tree and get followed by the uploader
          rm -f "$GITHUB_WORKSPACE"/out/modules/lib/modules/*/build "$GITHUB_WORKSPACE"/out/modules/lib/modules/*/source
          # Tree for building out-of-tree modules later (no objects)
          cd "$(dirname "$KROOT")"
          echo "packing tree..."; date
          tar --exclude='*.o' --exclude='*.a' --exclude='*.ko' --exclude='vmlinux' --exclude='.git' \
            -I 'zstd -T0 -3' -cf "$GITHUB_WORKSPACE/out/kernel-tree-for-modules.tar.zst" "$(basename "$KROOT")"
          # vmlinux has DWARF (CONFIG_DEBUG_INFO=y): useful for pahole struct-layout diffs vs the TV
          zstd -T0 -3 -q -o "$GITHUB_WORKSPACE/out/vmlinux.zst" "$KROOT/vmlinux" || true
          date
          echo "== what is in out/ (sizes)"; du -sh "$GITHUB_WORKSPACE"/out/* | sort -h

      - name: Probe struct wiphy layout in this tree (patch to 4 bands only if needed)
        if: ${{ !inputs.map_only }}
        continue-on-error: true
        run: |
          set -euo pipefail
          # The TV's cfg80211 measured: NUM_BANDS=4, wiphy->bands at 0xe8, so reg_notifier at 0x108.
          probe="$RUNNER_TEMP/probe"; mkdir -p "$probe"
          cat > "$probe/probe.c" <<'CSRC'
          #include <linux/module.h>
          #include <linux/stddef.h>
          #include <net/cfg80211.h>
          #define X(n, v) const int n = (v)
          X(num_bands, IEEE80211_NUM_BANDS);
          X(wiphy_size, sizeof(struct wiphy));
          X(wiphy_off_bands, offsetof(struct wiphy, bands));
          X(wiphy_off_reg_notifier, offsetof(struct wiphy, reg_notifier));
          X(wiphy_off_regd, offsetof(struct wiphy, regd));
          MODULE_LICENSE("GPL");
          CSRC
          echo 'obj-m := probe.o' > "$probe/Makefile"
          cat > "$RUNNER_TEMP/probe.py" <<'PYCODE'
          import re, subprocess, sys, tempfile, os
          obj, prefix = sys.argv[1], sys.argv[2]
          syms = subprocess.run([prefix + "nm", obj], capture_output=True, text=True, check=True).stdout
          with tempfile.TemporaryDirectory() as d:
              blob = os.path.join(d, "rodata.bin")
              subprocess.run([prefix + "objcopy", "-O", "binary", "-j", ".rodata", obj, blob], check=True)
              data = open(blob, "rb").read()
          for line in syms.splitlines():
              m = re.match(r'^([0-9a-f]+)\s+[Rr]\s+((?:wiphy|num)_[a-z_0-9]+)$', line)
              if m:
                  off = int(m.group(1), 16)
                  val = int.from_bytes(data[off:off + 4], "little")
                  print("  %-26s %5d  (0x%x)" % (m.group(2), val, val))
          PYCODE
          run_probe() {
            rm -f "$probe/probe.o" "$probe/probe.ko"
            make -C "$KROOT" M="$probe" ARCH=arm64 CROSS_COMPILE="$CROSS" HOSTCC=gcc-9 modules > "$probe/probe.log" 2>&1 \
              || { echo "probe build failed:"; tail -20 "$probe/probe.log"; return 1; }
            python3 -I "$RUNNER_TEMP/probe.py" "$probe/probe.o" "$CROSS"
          }
          mkdir -p "$GITHUB_WORKSPACE/out"
          echo "== layout in this tree (as built)"
          run_probe | tee "$GITHUB_WORKSPACE/out/cfg80211-layout.txt"
          echo "== TV measured: num_bands=4, wiphy_off_bands=232 (0xe8), wiphy_off_reg_notifier=264 (0x108)"
          nb="$(awk '$1=="num_bands"{print $2}' "$GITHUB_WORKSPACE/out/cfg80211-layout.txt")"
          if [ "$nb" = "3" ]; then
            echo "tree has 3 bands, TV has 4: patching include/net/cfg80211.h"
            python3 -I - "$KROOT/include/net/cfg80211.h" <<'PYCODE'
          import sys
          from pathlib import Path
          p = Path(sys.argv[1])
          t = p.read_text()
          old = "\t/* keep last */\n\tIEEE80211_NUM_BANDS\n};"
          new = "\tIEEE80211_BAND_LG_EXTRA = 3,\n\n\t/* keep last */\n\tIEEE80211_NUM_BANDS\n};"
          if t.count(old) != 1:
              raise SystemExit("band enum anchor: found %d" % t.count(old))
          p.write_text(t.replace(old, new))
          print("patched", p)
          PYCODE
            echo "== layout after patch"
            run_probe | tee "$GITHUB_WORKSPACE/out/cfg80211-layout-patched.txt"
          else
            echo "tree already has $nb bands: no patch needed"
          fi

      - name: Build 88XXau.ko against this tree
        if: ${{ !inputs.map_only }}
        continue-on-error: true
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/drv-src"; mkdir -p "$src"; cd "$src"
          git init -q .
          git remote add origin "$DRIVER_REPO"
          git fetch -q --depth 1 origin "$DRIVER_SHA"
          git checkout -q FETCH_HEAD
          git log -1 --format='driver commit %H (%cs) %s'

          # cfg80211_connect_bss() only exists from 4.11; use cfg80211_connect_result() on 4.4
          python3 -I - "$src" <<'PYCODE'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1]) / "os_dep/linux/ioctl_cfg80211.c"
          text = path.read_text()

          old_cond = ("#if (LINUX_VERSION_CODE >= KERNEL_VERSION(4, 10, 0) || "
                      "defined(CONFIG_CFG80211_CONNECT_BSS_ANDROID))")
          new_cond = old_cond.replace("(4, 10, 0)", "(4, 11, 0)")
          if text.count(old_cond) != 1:
              raise SystemExit(f"connect_bss condition: expected 1 match, found {text.count(old_cond)}")
          text = text.replace(old_cond, new_cond)

          legacy = re.compile(
              r"(\t\t#else // \(LINUX_VERSION_CODE >= KERNEL_VERSION\(4, 10, 0\)\)\n"
              r"\s*// Linux < 4\.10\.x does not accept the last argument \(timeout\)\.\n)"
              r"(\s*)cfg80211_connect_bss\(wdev_to_ndev\(pwdev\), cur_network->network\.MacAddress, bss\n"
              r"(.*?)"
              r", WLAN_STATUS_SUCCESS, GFP_ATOMIC\);\n", re.S)

          def repl(m):
              ind, body = m.group(2), m.group(3)
              return (m.group(1)
                  + ind + "/* Linux < 4.11: no cfg80211_connect_bss(); use cfg80211_connect_result(). */\n"
                  + ind + "cfg80211_connect_result(wdev_to_ndev(pwdev), cur_network->network.MacAddress\n"
                  + body + ", WLAN_STATUS_SUCCESS, GFP_ATOMIC);\n"
                  + ind + "if (bss)\n" + ind + "\tcfg80211_put_bss(pwdev->wiphy, bss);\n")

          text, n = legacy.subn(repl, text)
          if n != 1:
              raise SystemExit(f"legacy connect_bss call: expected 1 match, found {n}")
          path.write_text(text)
          print("patched ioctl_cfg80211.c")
          PYCODE
          { grep -rlE -e '-Werror' --include='Makefile*' --include='Kbuild' --include='*.mk' "$src" || true; } \
            | xargs -r sed -i -E 's/-Werror(=[A-Za-z0-9_-]+)?//g'

          set +e
          make -k -j"$(nproc)" -C "$KROOT" M="$src" \
            ARCH=arm64 CROSS_COMPILE="$CROSS" HOSTCC=gcc-9 \
            CONFIG_88XXAU=m CONFIG_PLATFORM_I386_PC=n CONFIG_PLATFORM_ARM64_RPI=y \
            KSRC="$KROOT" modules 2>&1 | tee "$GITHUB_WORKSPACE/out/driver-build.log"
          echo "make exit: ${PIPESTATUS[0]}"
          set -e
          echo "--- compile errors ---"
          grep -E ' error[: ]|undefined reference|\*\*\*' "$GITHUB_WORKSPACE/out/driver-build.log" | head -40 || true
          test -f "$src/88XXau.ko"

          ko="$src/88XXau.ko"
          cp "$ko" "$GITHUB_WORKSPACE/out/88XXau.debug.ko"
          cp "$ko" "$GITHUB_WORKSPACE/out/88XXau.ko"
          "${CROSS}strip" --strip-debug "$GITHUB_WORKSPACE/out/88XXau.ko"
          vm="$(modinfo -F vermagic "$ko")"
          echo "vermagic: $vm"
          [ "$vm" = "$TV_VERMAGIC" ] && echo "vermagic matches the TV" || echo "::warning::vermagic '$vm' != TV '$TV_VERMAGIC'"

          # Unknown symbols only show up at insmod (MODVERSIONS is off), so check here.
          "${CROSS}nm" -u "$ko" | awk '{print $2}' | sort -u > "$RUNNER_TEMP/undef.txt"
          awk '{print $2}' "$KROOT/Module.symvers" | sort -u > "$RUNNER_TEMP/exported.txt"
          if [ -f tv-kallsyms.txt ]; then   # symbols that really exist on the TV (name = column 2)
            awk '{print $2}' "$GITHUB_WORKSPACE/tv-kallsyms.txt" | sort -u >> "$RUNNER_TEMP/exported.txt"
            sort -u -o "$RUNNER_TEMP/exported.txt" "$RUNNER_TEMP/exported.txt"
          fi
          comm -23 "$RUNNER_TEMP/undef.txt" "$RUNNER_TEMP/exported.txt" > "$GITHUB_WORKSPACE/out/missing-symbols.txt"
          echo "undefined symbols: $(wc -l < "$RUNNER_TEMP/undef.txt"), not found in exports: $(wc -l < "$GITHUB_WORKSPACE/out/missing-symbols.txt")"
          cat "$GITHUB_WORKSPACE/out/missing-symbols.txt"
          (cd "$GITHUB_WORKSPACE/out" && sha256sum 88XXau.ko | tee 88XXau.ko.sha256)

      - name: Upload core output (small)
        if: ${{ !inputs.map_only }}
        uses: actions/upload-artifact@v4
        with:
          name: lg-kernel-core
          path: |
            out/kernel.config
            out/System.map
            out/Module.symvers
            out/kernel.release
            out/Image*
            out/kernel-build.log
            out/modules/
            out/88XXau*
            out/cfg80211-*
            out/driver-build.log
            out/missing-symbols.txt
          if-no-files-found: error

      - name: Upload kernel tree + vmlinux (big, already compressed)
        if: ${{ !inputs.map_only }}
        uses: actions/upload-artifact@v4
        with:
          name: lg-kernel-tree
          path: |
            out/kernel-tree-for-modules.tar.zst
            out/vmlinux.zst
          compression-level: 0
          retention-days: 3
          if-no-files-found: warn

      - name: Collect build errors (runs even when the build fails)
        if: ${{ always() && !inputs.map_only }}
        run: |
          set +e
          log="$RUNNER_TEMP/kernel-build.log"
          mkdir -p errors
          [ -f "$log" ] || { echo "no build log (failed before make)"; exit 0; }
          grep -E ' error: |fatal error|undefined reference|No rule to make target|\*\*\* ' "$log" > errors/all-errors.txt
          grep -oE '^[^ ]+\.[chS]:[0-9]+:[0-9]+: error: .*' "$log" > errors/compile-errors.txt
          grep -n -m1 -B8 -A12 -E ' error: |No rule to make target' "$log" > errors/first-error.txt
          grep 'No rule to make target' "$log" | sort -u > errors/missing-targets.txt
          grep -oE '\*\*\* \[[^]]*\]' "$log" | sort -u > errors/failed-targets.txt
          sed -E 's/:[0-9]+:[0-9]+: error:.*//' errors/compile-errors.txt | sort | uniq -c | sort -rn > errors/by-file.txt
          sed -E 's/:[0-9]+:[0-9]+: error:.*//; s|/[^/]*$||' errors/compile-errors.txt | sort | uniq -c | sort -rn > errors/by-dir.txt
          sed -E 's/^[^:]+:[0-9]+:[0-9]+: error: //' errors/compile-errors.txt \
            | sed -E "s/'[^']*'/'X'/g" | sort | uniq -c | sort -rn | head -40 > errors/by-message.txt
          grep -c ' warning: ' "$log" > errors/warning-count.txt
          tail -150 "$log" > errors/tail.txt
          gzip -c "$log" > errors/kernel-build.log.gz
          cp "$KROOT/.config" errors/dot-config 2>/dev/null
          {
            echo "### Kernel build errors"
            echo "compile errors: $(wc -l < errors/compile-errors.txt), failed targets: $(wc -l < errors/failed-targets.txt), missing make rules: $(wc -l < errors/missing-targets.txt)"
            echo; echo "#### Errors by directory"; echo '```'; head -15 errors/by-dir.txt; echo '```'
            echo "#### Most common messages"; echo '```'; head -15 errors/by-message.txt; echo '```'
            echo "#### Missing make rules"; echo '```'; head -10 errors/missing-targets.txt; echo '```'
            echo "#### First error in context"; echo '```'; head -40 errors/first-error.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          ls -l errors

      - name: Upload build errors
        if: ${{ always() && !inputs.map_only }}
        uses: actions/upload-artifact@v4
        with:
          name: build-errors
          path: errors/
          if-no-files-found: ignore
