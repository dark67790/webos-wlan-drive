name: RTL8812AU 88XXau module build

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rtl8812au-module-build.yml
      - tv-kernel.config
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned tip of aircrack-ng/rtl8812au branch v5.6.4.2 (2026-03-17).
  DRIVER_REPO: https://github.com/aircrack-ng/rtl8812au.git
  DRIVER_SHA: 734485506a30d6237c2deaad666a19f8ca5379f2
  # What the TV reports; only used for a warning if LG's tree says otherwise.
  TV_RELEASE: 4.4.84-229.kcl4tv.6

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out build configuration (tv-kernel.config)
        uses: actions/checkout@v4

      - name: Install AArch64 kernel build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex make git libelf-dev libssl-dev perl python3 tar xz-utils unzip kmod file \
            gcc-aarch64-linux-gnu gcc-9 gcc-9-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Install GCC 8.2 AArch64 cross compiler (Arm GNU-A 8.2-2019.01)
        run: |
          # The TV kernel was built with GCC 8.2.0. Use the same major version when
          # the download works; otherwise fall back to apt's gcc-9 (the compiler the
          # earlier hello and MT7921 probes used). The choice is exported as CC.
          cd "$RUNNER_TEMP"
          f=gcc-arm-8.2-2019.01-x86_64-aarch64-linux-gnu.tar.xz
          base=https://developer.arm.com/-/media/Files/downloads/gnu-a/8.2-2019.01
          if curl -fL --retry 3 -o "$f" "$base/$f" || curl -fL --retry 3 -o "$f" "$base/binrel/$f"; then
            sha256sum "$f"
            tar -xf "$f"
            bin="$RUNNER_TEMP/${f%.tar.xz}/bin"
            echo "$bin" >> "$GITHUB_PATH"
            echo "CC=$bin/aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
            echo "STRIP=$bin/aarch64-linux-gnu-strip" >> "$GITHUB_ENV"
            "$bin/aarch64-linux-gnu-gcc" --version | head -1
          else
            echo "::warning::Could not download Arm GCC 8.2; using apt gcc-9 instead"
            echo "CC=aarch64-linux-gnu-gcc-9" >> "$GITHUB_ENV"
            echo "STRIP=aarch64-linux-gnu-strip" >> "$GITHUB_ENV"
            aarch64-linux-gnu-gcc-9 --version | head -1
          fi

      - name: Download LG prepared build tree on runner
        env:
          KERNEL_SHARE_URL: https://gofile.io/d/yjgaN3fb
        run: |
          python3 -m pip install --user gallery-dl
          mkdir -p "$RUNNER_TEMP/gofile-source"
          "$HOME/.local/bin/gallery-dl" \
            --destination "$RUNNER_TEMP/gofile-source" \
            "$KERNEL_SHARE_URL"
          find "$RUNNER_TEMP/gofile-source" -type f -printf '%p (%s bytes)\n'

      - name: Unpack LG package and locate prepared output
        run: |
          set -euo pipefail
          unpacked="$RUNNER_TEMP/lg-unpacked"
          mkdir -p "$unpacked"
          mapfile -t archives < <(find "$RUNNER_TEMP/gofile-source" -type f \
            \( -name '*.tar' -o -name '*.tar.gz' -o -name '*.tgz' \
               -o -name '*.tar.xz' -o -name '*.tar.bz2' -o -name '*.zip' \))
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "Expected one LG package archive; found ${#archives[@]}"
            exit 1
          fi
          case "${archives[0]}" in
            *.zip) unzip -q "${archives[0]}" -d "$unpacked" ;;
            *) tar -xf "${archives[0]}" -C "$unpacked" ;;
          esac

          # The Gofile package contains the prepared output in a nested tarball.
          for pass in $(seq 1 10); do
            mapfile -t nested < <(find "$unpacked" -type f \
              \( -name '*.tar' -o -name '*.tar.gz' -o -name '*.tgz' \
                 -o -name '*.tar.xz' -o -name '*.tar.bz2' -o -name '*.zip' \))
            [ "${#nested[@]}" -gt 0 ] || break
            for archive in "${nested[@]}"; do
              case "$archive" in
                *.zip) unzip -q "$archive" -d "$(dirname "$archive")" ;;
                *) tar -xf "$archive" -C "$(dirname "$archive")" ;;
              esac
              mv "$archive" "$archive.extracted"
            done
          done

          mapfile -t build_trees < <(find "$unpacked" -type f -name Module.symvers \
            -printf '%h\n' | while read -r d; do
              [ -f "$d/.config" ] && [ -f "$d/include/config/kernel.release" ] && echo "$d"
            done)
          if [ "${#build_trees[@]}" -ne 1 ]; then
            echo "Expected one prepared LG output tree with Module.symvers and .config; found ${#build_trees[@]}"
            find "$unpacked" -maxdepth 6 \( -name Module.symvers -o -name kernel.release \) -print
            exit 1
          fi
          printf 'KERNEL_BUILD=%s\n' "${build_trees[0]}" >> "$GITHUB_ENV"
          rel="$(cat "${build_trees[0]}/include/config/kernel.release")"
          echo "LG prepared release: $rel"
          if [ "$rel" != "$TV_RELEASE" ]; then
            echo "::warning::LG tree says '$rel' but the TV reports '$TV_RELEASE'"
          fi

      - name: Probe struct layout, then apply the TV's real config to the generated headers
        run: |
          set -uo pipefail
          # The first oops on the TV was in cfg80211's wiphy_apply_custom_regulatory:
          # it read a wiphy->bands[] slot that held the driver's reg_notifier function
          # pointer, i.e. struct wiphy is laid out differently in the module than in the
          # TV's built-in cfg80211. struct wiphy has 16 bytes (wowlan, wowlan_config)
          # that exist only with CONFIG_PM, and LG's prepared .config is the config of
          # the MT7921 driver package, not necessarily the TV's. Make the generated
          # headers (autoconf.h, auto.conf) match the config captured from the TV.
          # .config itself is NOT touched, so kbuild never re-runs (silent)oldconfig.
          probe="$RUNNER_TEMP/probe"
          mkdir -p "$probe"
          cat > "$probe/probe.c" <<'CSRC'
          #include <linux/module.h>
          #include <linux/stddef.h>
          #include <linux/netdevice.h>
          #include <linux/usb.h>
          #include <net/cfg80211.h>
          #define X(n, v) const int n = (v)
          X(wiphy_size, sizeof(struct wiphy));
          X(wiphy_off_bands, offsetof(struct wiphy, bands));
          X(wiphy_off_reg_notifier, offsetof(struct wiphy, reg_notifier));
          X(wiphy_off_regd, offsetof(struct wiphy, regd));
          X(wiphy_off_dev, offsetof(struct wiphy, dev));
          X(num_bands, IEEE80211_NUM_BANDS);
          X(device_size, sizeof(struct device));
          X(netdev_size, sizeof(struct net_device));
          X(netdev_off_netdev_ops, offsetof(struct net_device, netdev_ops));
          X(wdev_size, sizeof(struct wireless_dev));
          X(usb_device_size, sizeof(struct usb_device));
          X(usb_interface_size, sizeof(struct usb_interface));
          X(sk_buff_size, sizeof(struct sk_buff));
          #ifdef CONFIG_PM
          X(cfg_pm, 1);
          #else
          X(cfg_pm, 0);
          #endif
          MODULE_LICENSE("GPL");
          CSRC
          sed -i 's/^          //' "$probe/probe.c"
          echo 'obj-m := probe.o' > "$probe/Makefile"
          cat > "$RUNNER_TEMP/probe.py" <<'PYCODE'
          import re, subprocess, sys, tempfile, os
          obj, prefix = sys.argv[1], sys.argv[2]
          syms = subprocess.run([prefix + "nm", obj], capture_output=True, text=True, check=True).stdout
          with tempfile.TemporaryDirectory() as d:
              blob = os.path.join(d, "rodata.bin")
              subprocess.run([prefix + "objcopy", "-O", "binary", "-j", ".rodata", obj, blob], check=True)
              data = open(blob, "rb").read()
          for line in syms.splitlines():
              m = re.match(r'^([0-9a-f]+)\s+[Rr]\s+((?:wiphy|num|device|netdev|wdev|usb|sk_buff|cfg)_[a-z_0-9]+)$', line)
              if m:
                  off = int(m.group(1), 16)
                  val = int.from_bytes(data[off:off + 4], "little")
                  print("  %-26s %5d  (0x%x)" % (m.group(2), val, val))
          PYCODE
          sed -i 's/^          //' "$RUNNER_TEMP/probe.py"
          run_probe() {
            rm -f "$probe/probe.o" "$probe/probe.ko"
            make -C "$KERNEL_BUILD" M="$probe" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
              CC="$CC" HOSTCC=gcc-9 modules > "$probe/probe.log" 2>&1 \
              || { echo "probe build failed:"; tail -15 "$probe/probe.log"; return 0; }
            python3 -I "$RUNNER_TEMP/probe.py" "$probe/probe.o" aarch64-linux-gnu-
          }

          echo "== layout with LG's prepared headers (as shipped)"
          run_probe | tee "$RUNNER_TEMP/layout-lg.txt"

          echo "== options that differ between LG's .config and the TV's config (first 80)"
          norm() { grep -E '^(CONFIG_|# CONFIG_)' "$1" | sed -E 's/^# (CONFIG_[A-Za-z0-9_]+) is not set$/\1=n/' | LC_ALL=C sort -t= -k1,1; }
          norm "$KERNEL_BUILD/.config" > "$RUNNER_TEMP/lg.norm"
          norm tv-kernel.config > "$RUNNER_TEMP/tv.norm"
          join -t= -a1 -a2 -e '<absent>' -o 0,1.2,2.2 "$RUNNER_TEMP/lg.norm" "$RUNNER_TEMP/tv.norm" \
            | awk -F= '{a=$2; b=$3; if (a=="<absent>") a="n"; if (b=="<absent>") b="n";
                        if (a!=b) printf "  %s  LG=%s  TV=%s\n", $1, $2, $3}' > "$RUNNER_TEMP/config-diff.txt"
          echo "  total differing options: $(wc -l < "$RUNNER_TEMP/config-diff.txt")"
          head -80 "$RUNNER_TEMP/config-diff.txt"
          grep -E 'CONFIG_(PM|PM_SLEEP|PINCTRL|WIRELESS_EXT|WEXT_CORE|CFG80211_WEXT|PREEMPT|SMP|MODULES|MODVERSIONS)\b' \
            "$RUNNER_TEMP/config-diff.txt" || true

          echo "== regenerating autoconf.h and auto.conf from tv-kernel.config"
          cp "$KERNEL_BUILD/include/generated/autoconf.h" "$RUNNER_TEMP/autoconf.h.lg"
          cp "$KERNEL_BUILD/include/config/auto.conf" "$RUNNER_TEMP/auto.conf.lg"
          python3 -I - tv-kernel.config "$KERNEL_BUILD" <<'PYCODE'
          import re, sys
          from pathlib import Path
          cfg, build = Path(sys.argv[1]), Path(sys.argv[2])
          conf_lines, h_lines = [], []
          for line in cfg.read_text().splitlines():
              m = re.match(r'^(CONFIG_[A-Za-z0-9_]+)=(.*)$', line)
              if not m:
                  continue
              name, val = m.groups()
              conf_lines.append(f"{name}={val}")
              if val == "y":
                  h_lines.append(f"#define {name} 1")
              elif val == "m":
                  h_lines.append(f"#define {name}_MODULE 1")
              else:                       # strings keep their quotes, numbers/hex as is
                  h_lines.append(f"#define {name} {val}")
          hdr = "/*\n *\n * Automatically generated file; DO NOT EDIT.\n * Regenerated from tv-kernel.config\n *\n */\n"
          (build / "include/generated/autoconf.h").write_text(hdr + "\n".join(h_lines) + "\n")
          (build / "include/config/auto.conf").write_text(
              "#\n# Automatically generated file; DO NOT EDIT.\n#\n" + "\n".join(conf_lines) + "\n")
          print(f"wrote {len(h_lines)} defines")
          PYCODE
          # auto.conf/autoconf.h must be newer than .config or kbuild re-runs oldconfig
          touch "$KERNEL_BUILD/include/config/auto.conf" "$KERNEL_BUILD/include/generated/autoconf.h"
          for sym in PM PINCTRL WIRELESS_EXT WEXT_CORE PREEMPT SMP MODULES; do
            grep -q "^#define CONFIG_${sym} 1$" "$KERNEL_BUILD/include/generated/autoconf.h" \
              || { echo "::error::CONFIG_${sym} missing from regenerated autoconf.h"; exit 1; }
          done
          grep -q '^#define CONFIG_MODVERSIONS' "$KERNEL_BUILD/include/generated/autoconf.h" \
            && { echo "::error::TV has no MODVERSIONS but autoconf.h defines it"; exit 1; }

          echo "== layout with the TV's config"
          run_probe | tee "$RUNNER_TEMP/layout-tv.txt"
          echo "(oops on the TV: the kernel's wiphy->bands[2] slot held reg_notifier, i.e."
          echo " kernel bands offset = module bands offset + 16 with the LG headers)"

      - name: Build wiphy layout probe module (safe, touches no hardware)
        run: |
          set -u
          # Loading wiphy_probe.ko on the TV tells us where the TV's cfg80211 really keeps
          # wiphy->bands and regulatory_flags, to compare with what this module was compiled
          # with. It only works on fake memory and unloads itself (insmod reports an error on
          # purpose); read the result with: dmesg | grep WPROBE
          wp="$RUNNER_TEMP/wprobe"
          mkdir -p "$wp"
          cat > "$wp/wiphy_probe.c" <<'CSRC'
          // Safe layout probe: builds a FAKE zeroed "wiphy" in plain kernel memory, plants a pointer to
          // a one-channel band in every 8-byte slot of a window, and calls the kernel's own
          // wiphy_apply_custom_regulatory() on it. The slots the kernel actually dereferences as
          // wiphy->bands[0..2] get their channel modified, which reveals where the TV's cfg80211
          // really keeps wiphy->bands. It also reveals where the kernel keeps regulatory_flags.
          // No real device or wiphy is touched.
          #include <linux/module.h>
          #include <linux/slab.h>
          #include <linux/stddef.h>
          #include <net/cfg80211.h>

          #define SLOT_LO 0x40
          #define SLOT_HI 0x1c0
          #define NSLOT ((SLOT_HI - SLOT_LO) / 8)

          static int __init wprobe_init(void)
          {
          	struct ieee80211_regdomain *regd;
          	struct ieee80211_channel *ch;
          	struct ieee80211_supported_band *sb;
          	u8 *fake;
          	int i, hits = 0;

          	printk(KERN_ERR "WPROBE: module view: sizeof(wiphy)=0x%x bands=0x%x reg_notifier=0x%x regd=0x%x regulatory_flags=0x%x NUM_BANDS=%d\n",
          	       (int)sizeof(struct wiphy), (int)offsetof(struct wiphy, bands),
          	       (int)offsetof(struct wiphy, reg_notifier), (int)offsetof(struct wiphy, regd),
          	       (int)offsetof(struct wiphy, regulatory_flags), (int)IEEE80211_NUM_BANDS);

          	regd = kzalloc(sizeof(*regd) + sizeof(struct ieee80211_reg_rule), GFP_KERNEL);
          	ch = kcalloc(NSLOT, sizeof(*ch), GFP_KERNEL);
          	sb = kcalloc(NSLOT, sizeof(*sb), GFP_KERNEL);
          	fake = kzalloc(PAGE_SIZE, GFP_KERNEL);
          	if (!regd || !ch || !sb || !fake) {
          		printk(KERN_ERR "WPROBE: out of memory\n");
          		goto out;
          	}

          	regd->n_reg_rules = 1;
          	regd->alpha2[0] = '9';
          	regd->alpha2[1] = '9';
          	regd->reg_rules[0] = (struct ieee80211_reg_rule)
          		REG_RULE(2402 - 10, 2494 + 10, 40, 6, 20, 0);

          	for (i = 0; i < NSLOT; i++) {
          		ch[i].band = IEEE80211_BAND_2GHZ;
          		ch[i].center_freq = 2412;
          		ch[i].hw_value = 1;
          		ch[i].max_reg_power = -1;
          		ch[i].max_power = -1;
          		sb[i].channels = &ch[i];
          		sb[i].n_channels = 1;
          		sb[i].band = IEEE80211_BAND_2GHZ;
          		*(struct ieee80211_supported_band **)(fake + SLOT_LO + 8 * i) = &sb[i];
          	}

          	/* expect one WARN about REGULATORY_CUSTOM_REG not being set; harmless */
          	wiphy_apply_custom_regulatory((struct wiphy *)fake, regd);

          	for (i = 0; i < NSLOT; i++) {
          		if (ch[i].max_reg_power != -1 || ch[i].orig_flags) {
          			printk(KERN_ERR "WPROBE: kernel read slot 0x%x as a band (max_reg_power=%d orig_flags=0x%x)\n",
          			       SLOT_LO + 8 * i, ch[i].max_reg_power, ch[i].orig_flags);
          			hits++;
          		}
          	}
          	printk(KERN_ERR "WPROBE: %d slot(s) processed; kernel's wiphy->bands[0] = lowest of them\n", hits);

          	for (i = 0; i < PAGE_SIZE; i += 4) {
          		u32 v = *(u32 *)(fake + i);
          		if (i >= SLOT_LO && i < SLOT_HI)
          			continue;
          		if (v)
          			printk(KERN_ERR "WPROBE: kernel wrote 0x%x at fake wiphy offset 0x%x (regulatory_flags if it is 1)\n", v, i);
          	}
          out:
          	kfree(fake);
          	kfree(sb);
          	kfree(ch);
          	kfree(regd);
          	return -EAGAIN;	/* probe only: do not stay loaded */
          }

          module_init(wprobe_init);
          MODULE_LICENSE("GPL");
          CSRC
          sed -i 's/^          //' "$wp/wiphy_probe.c"
          echo 'obj-m := wiphy_probe.o' > "$wp/Makefile"
          make -C "$KERNEL_BUILD" M="$wp" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CC="$CC" HOSTCC=gcc-9 modules 2>&1 | tail -15
          ls -l "$wp/wiphy_probe.ko"
          "$STRIP" --strip-debug "$wp/wiphy_probe.ko"
          modinfo "$wp/wiphy_probe.ko" | grep -E '^(vermagic|depends)'

      - name: Diagnostics - LG headers vs vanilla 4.4.84, and kernel objects to disassemble
        run: |
          set -u
          # Information only; never fails the job. The TV oops shows cfg80211 reading a
          # wiphy->bands[] slot that holds the driver's reg_notifier, so find out whether
          # LG's cfg80211.h/nl80211.h really equal vanilla 4.4.84, and whether the package
          # contains any built kernel objects (reg.o, vmlinux) that show the real layout.
          diag="$RUNNER_TEMP/lg-diagnostics.txt"
          : > "$diag"
          {
            LG="$(readlink -f "$KERNEL_BUILD/kernel-source" 2>/dev/null || true)"
            echo "LG source dir: ${LG:-<none>}"
            echo "== LINUX_VERSION_CODE in LG tree"
            grep -rh 'LINUX_VERSION_CODE\|UTS_RELEASE' "$KERNEL_BUILD/include/generated/uapi/linux/version.h" \
              "$KERNEL_BUILD/include/generated/utsrelease.h" 2>/dev/null
            for h in include/net/cfg80211.h include/uapi/linux/nl80211.h include/linux/ieee80211.h; do
              echo "== diff vanilla v4.4.84 vs LG: $h"
              if curl -fsSL --retry 3 -o "$RUNNER_TEMP/vanilla.h" \
                   "https://raw.githubusercontent.com/gregkh/linux/v4.4.84/$h"; then
                if [ -n "$LG" ] && [ -f "$LG/$h" ]; then
                  diff -u "$RUNNER_TEMP/vanilla.h" "$LG/$h" | head -120 && echo "(end of diff)"
                  cmp -s "$RUNNER_TEMP/vanilla.h" "$LG/$h" && echo "IDENTICAL"
                else
                  echo "LG has no $h"
                fi
              else
                echo "could not fetch vanilla $h"
              fi
            done
            echo "== built kernel objects in the LG package"
            find "$RUNNER_TEMP/lg-unpacked" -type f -not -path '*/arch/*' -not -path '*/scripts/*' \
              \( -name vmlinux -o -name System.map -o -name 'Image' -o -name 'Image.gz' -o -name reg.o \
                 -o -name cfg80211.o -o -name cfg80211.ko \) -printf '%p (%s bytes)\n'
            reg="$(find "$RUNNER_TEMP/lg-unpacked" -type f -name reg.o -path '*net/wireless*' -print -quit)"
            if [ -n "$reg" ]; then
              for fn in wiphy_apply_custom_regulatory handle_channel_custom.isra.18 handle_channel_custom; do
                echo "== disassembly: $fn"
                aarch64-linux-gnu-objdump -d --no-show-raw-insn "$reg" \
                  | awk -v f="<$fn>:" '$2==f {p=1} p {print} p && /^$/ {exit}' | head -80
              done
            fi
          } > "$diag" 2>&1
          cat "$diag"
          exit 0

      - name: Fetch rtl8812au (pinned commit)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/drv-src"
          cd "$RUNNER_TEMP/drv-src"
          git init -q .
          git remote add origin "$DRIVER_REPO"
          git fetch -q --depth 1 origin "$DRIVER_SHA"
          git checkout -q FETCH_HEAD
          git log -1 --format='driver commit %H (%cs) %s'
          echo "DRV=$RUNNER_TEMP/drv-src" >> "$GITHUB_ENV"

      - name: Patch driver for Linux 4.4 (cfg80211_connect_bss does not exist before 4.11)
        run: |
          set -euo pipefail
          python3 -I - "$DRV" <<'PYCODE'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1]) / "os_dep/linux/ioctl_cfg80211.c"
          text = path.read_text()

          # The driver switches to the 6-argument cfg80211_connect_bss() at 4.10,
          # but that function only appeared in 4.11. On 4.4 use
          # cfg80211_connect_result() and drop the bss reference ourselves.
          old_cond = ("#if (LINUX_VERSION_CODE >= KERNEL_VERSION(4, 10, 0) || "
                      "defined(CONFIG_CFG80211_CONNECT_BSS_ANDROID))")
          new_cond = old_cond.replace("(4, 10, 0)", "(4, 11, 0)")
          if text.count(old_cond) != 1:
              raise SystemExit(f"connect_bss condition: expected 1 match, found {text.count(old_cond)}")
          text = text.replace(old_cond, new_cond)

          legacy = re.compile(
              r"(\t\t#else // \(LINUX_VERSION_CODE >= KERNEL_VERSION\(4, 10, 0\)\)\n"
              r"\s*// Linux < 4\.10\.x does not accept the last argument \(timeout\)\.\n)"
              r"(\s*)cfg80211_connect_bss\(wdev_to_ndev\(pwdev\), cur_network->network\.MacAddress, bss\n"
              r"(.*?)"
              r", WLAN_STATUS_SUCCESS, GFP_ATOMIC\);\n", re.S)

          def repl(m):
              ind, body = m.group(2), m.group(3)
              return (m.group(1)
                  + ind + "/* Linux < 4.11: no cfg80211_connect_bss(); use cfg80211_connect_result(). */\n"
                  + ind + "cfg80211_connect_result(wdev_to_ndev(pwdev), cur_network->network.MacAddress\n"
                  + body + ", WLAN_STATUS_SUCCESS, GFP_ATOMIC);\n"
                  + ind + "if (bss)\n" + ind + "\tcfg80211_put_bss(pwdev->wiphy, bss);\n")

          text, n = legacy.subn(repl, text)
          if n != 1:
              raise SystemExit(f"legacy connect_bss call: expected 1 match, found {n}")
          path.write_text(text)
          print("patched ioctl_cfg80211.c")
          PYCODE
          grep -n 'cfg80211_connect_result\|cfg80211_connect_bss' "$DRV/os_dep/linux/ioctl_cfg80211.c"

          # Newer GCC treats a few of these as hard errors; the vendor makefile has none,
          # but strip any -Werror that may exist so a warning never blocks the .ko.
          { grep -rlE -e '-Werror' --include='Makefile*' --include='Kbuild' --include='*.mk' "$DRV" || true; } \
            | xargs -r sed -i -E 's/-Werror(=[A-Za-z0-9_-]+)?//g'

      - name: Build 88XXau.ko against LG's prepared tree
        run: |
          set -uo pipefail
          # No olddefconfig: LG's prepared tree and Module.symvers are used, with
          # autoconf.h/auto.conf regenerated from the TV's own config above, so struct
          # layouts (struct wiphy has CONFIG_PM members) match the TV kernel.
          #
          # Driver switches:
          #   CONFIG_88XXAU=m            the driver Makefile only sets this when invoked
          #                              directly, not through Kbuild
          #   CONFIG_PLATFORM_I386_PC=n  default platform; wrong endian/cfg80211 flags for ARM
          #   CONFIG_PLATFORM_ARM64_RPI=y generic little-endian arm64: adds
          #                              -DCONFIG_LITTLE_ENDIAN -DCONFIG_IOCTL_CFG80211
          #                              -DRTW_USE_CFG80211_STA_EVENT
          echo "compiler: $("$CC" --version | head -1)"
          make -k -j"$(nproc)" -C "$KERNEL_BUILD" M="$DRV" \
            ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="$CC" HOSTCC=gcc-9 \
            CONFIG_88XXAU=m \
            CONFIG_PLATFORM_I386_PC=n CONFIG_PLATFORM_ARM64_RPI=y \
            KSRC="$KERNEL_BUILD" \
            modules 2>&1 | tee "$RUNNER_TEMP/driver-build.log"
          status=${PIPESTATUS[0]}
          echo "make exit status: $status"
          echo "--- compile errors ---"
          grep -E ' error[: ]|undefined reference|\*\*\*' "$RUNNER_TEMP/driver-build.log" | head -60 || true
          test -f "$DRV/88XXau.ko"

      - name: Check the module against LG's kernel
        run: |
          set -euo pipefail
          ko="$DRV/88XXau.ko"
          rel="$(cat "$KERNEL_BUILD/include/config/kernel.release")"
          file "$ko"
          ls -l "$ko"
          modinfo "$ko" | grep -E '^(filename|license|description|version|vermagic|depends|name|srcversion)' || true
          vm="$(modinfo -F vermagic "$ko")"
          echo "vermagic: $vm"
          case "$vm" in
            "$rel "*) echo "vermagic starts with LG kernel.release ($rel): OK" ;;
            *) echo "::error::vermagic '$vm' does not start with '$rel'"; exit 1 ;;
          esac
          echo "TV expects: $rel SMP preempt mod_unload aarch64  (CONFIG_MODVERSIONS is off)"

          # With MODVERSIONS off, a missing kernel export only shows up at insmod
          # time as "Unknown symbol". LG's Module.symvers lists everything exported,
          # so check here instead of on the TV.
          aarch64-linux-gnu-nm -u "$ko" | awk '{print $2}' | sort -u > "$RUNNER_TEMP/undef.txt"
          awk '{print $2}' "$KERNEL_BUILD/Module.symvers" | sort -u > "$RUNNER_TEMP/exported.txt"
          comm -23 "$RUNNER_TEMP/undef.txt" "$RUNNER_TEMP/exported.txt" > "$RUNNER_TEMP/missing.txt"
          echo "undefined symbols in 88XXau.ko: $(wc -l < "$RUNNER_TEMP/undef.txt")"
          echo "not exported by LG's kernel: $(wc -l < "$RUNNER_TEMP/missing.txt")"
          cat "$RUNNER_TEMP/missing.txt"
          if [ -s "$RUNNER_TEMP/missing.txt" ]; then
            echo "::warning::Some symbols are not in Module.symvers; insmod will say Unknown symbol for these"
          fi

      - name: Save artifacts
        run: |
          set -euo pipefail
          mkdir -p out
          cp "$DRV/88XXau.ko" out/88XXau.debug.ko
          cp "$DRV/88XXau.ko" out/88XXau.ko
          "$STRIP" --strip-debug out/88XXau.ko
          ls -l out
          cp "$RUNNER_TEMP/driver-build.log" out/
          cp "$RUNNER_TEMP/undef.txt" "$RUNNER_TEMP/missing.txt" out/
          cp "$KERNEL_BUILD/.config" out/lg-kernel.config
          cp "$RUNNER_TEMP/lg-diagnostics.txt" out/ || true
          cp "$RUNNER_TEMP/wprobe/wiphy_probe.ko" out/ || true
          cp "$RUNNER_TEMP"/layout-lg.txt "$RUNNER_TEMP"/layout-tv.txt "$RUNNER_TEMP"/config-diff.txt out/ || true
          (cd out && sha256sum 88XXau.ko > 88XXau.ko.sha256 && cat 88XXau.ko.sha256)

      - name: Upload module and logs
        uses: actions/upload-artifact@v4
        with:
          name: rtl8812au-88XXau
          path: out/
          if-no-files-found: error
