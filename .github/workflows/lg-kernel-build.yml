name: LG TV module build probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/lg-kernel-build.yml
      - tv-kernel.config
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Check out build configuration
        uses: actions/checkout@v4

      - name: Install AArch64 kernel build tools
        run: |
          sudo apt-get update
          # Linux 4.4.84 predates GCC 10 and the TV kernel itself was built with
          # GCC 8.2, so use GCC 9 for both the cross and host compilers instead
          # of the runner's default GCC 11.
          sudo apt-get install -y \
            bc bison flex make libelf-dev libssl-dev perl python3 tar xz-utils unzip \
            gcc-9 gcc-9-aarch64-linux-gnu kmod file
          aarch64-linux-gnu-gcc-9 --version | head -1

      - name: Download kernel source from Gofile
        env:
          KERNEL_SHARE_URL: https://gofile.io/d/yjgaN3fb
        run: |
          python3 -m pip install --user gallery-dl
          mkdir -p "$RUNNER_TEMP/gofile-source"
          "$HOME/.local/bin/gallery-dl" \
            --destination "$RUNNER_TEMP/gofile-source" \
            "$KERNEL_SHARE_URL"
          find "$RUNNER_TEMP/gofile-source" -type f -printf '%p (%s bytes)\n'

      - name: Unpack source and select kernel tree
        run: |
          set -euo pipefail
          unpacked="$RUNNER_TEMP/kernel-unpacked"
          mkdir -p "$unpacked"
          mapfile -t archives < <(find "$RUNNER_TEMP/gofile-source" -type f \
            \( -name '*.tar' -o -name '*.tar.gz' -o -name '*.tgz' \
               -o -name '*.tar.xz' -o -name '*.tar.bz2' -o -name '*.zip' \))
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "Expected one kernel source archive from the Gofile link; found ${#archives[@]}"
            find "$RUNNER_TEMP/gofile-source" -type f -printf '%p (%s bytes)\n'
            exit 1
          fi
          archive="${archives[0]}"
          case "$archive" in
            *.zip) unzip -q "$archive" -d "$unpacked" ;;
            *) tar -xf "$archive" -C "$unpacked" ;;
          esac

          # The Gofile payload can contain an LG package archive which in turn
          # contains the kernel tree. Keep extracting nested archives on runner.
          for pass in $(seq 1 20); do
            mapfile -t nested_archives < <(find "$unpacked" -type f \
              \( -name '*.tar' -o -name '*.tar.gz' -o -name '*.tgz' \
                 -o -name '*.tar.xz' -o -name '*.tar.bz2' -o -name '*.zip' \))
            [ "${#nested_archives[@]}" -gt 0 ] || break
            for nested in "${nested_archives[@]}"; do
              case "$nested" in
                *.zip) unzip -q "$nested" -d "$(dirname "$nested")" ;;
                *) tar -xf "$nested" -C "$(dirname "$nested")" ;;
              esac
              mv "$nested" "$nested.extracted"
            done
          done

          kernel_src=""
          while IFS= read -r makefile; do
            if grep -qE '^VERSION[[:space:]]*=' "$makefile" && \
               grep -qE '^PATCHLEVEL[[:space:]]*=' "$makefile" && \
               grep -qE '^SUBLEVEL[[:space:]]*=' "$makefile"; then
              kernel_src="$(dirname "$makefile")"
              break
            fi
          done < <(find "$unpacked" -type f -name Makefile -print)

          # LG's O20N archive ships a prepared output tree with a partial
          # kernel-source directory instead of a normal full kernel checkout.
          if [ -z "$kernel_src" ]; then
            mapfile -t partial_sources < <(find "$unpacked" -type d -name kernel-source -print)
            if [ "${#partial_sources[@]}" -eq 1 ]; then
              kernel_src="${partial_sources[0]}"
            fi
          fi
          if [ -z "$kernel_src" ]; then
            echo "Could not identify a kernel source root in the uploaded archive."
            find "$unpacked" -maxdepth 5 -type f | head -150
            exit 1
          fi

          prepared_build="$(dirname "$kernel_src")"
          if [ -f "$prepared_build/.config" ] && [ -f "$prepared_build/Makefile" ]; then
            kernel_build="$prepared_build"
            echo "Using LG prepared build tree: $kernel_build"
          else
            kernel_build="$RUNNER_TEMP/kernel-build"
            mkdir -p "$kernel_build"
            cp tv-kernel.config "$kernel_build/.config"
            echo "Using captured TV config for source tree: $kernel_src"
          fi
          printf 'KERNEL_SRC=%s\nKERNEL_BUILD=%s\n' "$kernel_src" "$kernel_build" >> "$GITHUB_ENV"
          echo "Kernel source: $kernel_src"
          if [ -f "$kernel_build/include/config/kernel.release" ]; then
            cat "$kernel_build/include/config/kernel.release"
          fi

      - name: Inspect prepared tree
        run: |
          echo "== build dir =="; ls -la "$KERNEL_BUILD" | head -40
          echo "== source dir =="; ls "$KERNEL_SRC"; du -sh "$KERNEL_SRC"
          for f in include/config/kernel.release include/generated/utsrelease.h; do
            if [ -f "$KERNEL_BUILD/$f" ]; then echo "== $f =="; cat "$KERNEL_BUILD/$f"; fi
          done
          echo "== host tools (they must run on this x86_64 runner) =="
          file "$KERNEL_BUILD/scripts/mod/modpost" "$KERNEL_BUILD/scripts/basic/fixdep" || true
          ls -la "$KERNEL_BUILD/Module.symvers" "$KERNEL_BUILD/include/config/auto.conf" \
            "$KERNEL_BUILD/include/generated/autoconf.h" || true
          echo "== how this kernel builds the module version string =="
          grep -n -B2 -A8 'define VERMAGIC_STRING' "$KERNEL_SRC/include/linux/vermagic.h" || true

      - name: Build a hello-world module against the prepared tree
        run: |
          set -euo pipefail
          hello="$RUNNER_TEMP/hello"
          mkdir -p "$hello"
          cat > "$hello/hello.c" <<'SRC'
          #include <linux/module.h>
          #include <linux/init.h>
          static int __init probe_init(void) { pr_info("webos module probe loaded\n"); return 0; }
          static void __exit probe_exit(void) { pr_info("webos module probe unloaded\n"); }
          module_init(probe_init);
          module_exit(probe_exit);
          MODULE_LICENSE("GPL");
          SRC
          echo 'obj-m := hello.o' > "$hello/Makefile"
          set +e
          make -C "$KERNEL_BUILD" M="$hello" ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- CC=aarch64-linux-gnu-gcc-9 HOSTCC=gcc-9 \
            modules 2>&1 | tee module-build.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "Hello module build exit code: $rc"
          grep -nE 'error:|Error [0-9]|No rule to make target|fatal error' module-build.log \
            | head -80 > hello-errors.txt || true
          cat hello-errors.txt
          if [ "$rc" -eq 0 ]; then
            file "$hello/hello.ko"
            modinfo "$hello/hello.ko" || true
          fi
          exit "$rc"

      - name: Locate the vendor Wi-Fi driver
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/kernel-unpacked"
          drv_makefile="$(find "$root" -type f -name 'Makefile_WEBOS60_O20N_64BitMachine' | head -1)"
          if [ -z "$drv_makefile" ]; then
            echo "Vendor makefile not found; directories in the package:"
            find "$root" -maxdepth 4 -type d | head -60
            exit 1
          fi
          printf 'DRIVER_DIR=%s\nDRIVER_MAKEFILE=%s\n' \
            "$(dirname "$drv_makefile")" "$(basename "$drv_makefile")" >> "$GITHUB_ENV"
          echo "== $drv_makefile =="
          cat "$drv_makefile"

      - name: Build the vendor Wi-Fi driver (gen4m MT7921)
        run: |
          set -euo pipefail
          cd "$DRIVER_DIR"
          # LG built this driver with GCC 8.2. GCC 9 adds new warnings (for example
          # address-of-packed-member) and the driver's flags turn warnings into
          # errors, so drop -Werror from the driver's own build files on the runner.
          echo "== -Werror in the driver's build files =="
          grep -rnE -e '-Werror' --include='Makefile*' --include='Kbuild' --include='*.mk' . || true
          grep -rlE -e '-Werror' --include='Makefile*' --include='Kbuild' --include='*.mk' . \
            | xargs -r sed -i -E 's/-Werror(=[A-Za-z0-9_-]+)?//g' || true
          touch "$RUNNER_TEMP/build-start"
          set +e
          # -k keeps going so one run lists every file that fails
          make -k -f "$DRIVER_MAKEFILE" ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- CC=aarch64-linux-gnu-gcc-9 HOSTCC=gcc-9 \
            KCFLAGS=-Wno-error=address-of-packed-member \
            2>&1 | tee "$GITHUB_WORKSPACE/driver-build.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "Driver build exit code: $rc"
          grep -nE 'error:|Error [0-9]|No rule to make target|fatal error' \
            "$GITHUB_WORKSPACE/driver-build.log" | head -80 > "$GITHUB_WORKSPACE/driver-errors.txt" || true
          cat "$GITHUB_WORKSPACE/driver-errors.txt"
          mkdir -p "$RUNNER_TEMP/module-output"
          find "$RUNNER_TEMP/kernel-unpacked" -name '*.ko' -newer "$RUNNER_TEMP/build-start" \
            -exec cp -v {} "$RUNNER_TEMP/module-output/" \;
          for ko in "$RUNNER_TEMP"/module-output/*.ko; do
            [ -e "$ko" ] || continue
            echo "$ko vermagic: $(modinfo -F vermagic "$ko")"
          done
          echo "TV modules report: 4.4.84 SMP preempt mod_unload aarch64"
          exit "$rc"

      - name: Save build logs and modules
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lg-module-build-probe
          path: |
            module-build.log
            hello-errors.txt
            driver-build.log
            driver-errors.txt
            ${{ runner.temp }}/module-output/*.ko
          if-no-files-found: warn
          retention-days: 14
