name: LG TV kernel build probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/lg-kernel-build.yml
      - tv-kernel.config
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Check out build configuration
        uses: actions/checkout@v4

      - name: Install AArch64 kernel build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex gcc-aarch64-linux-gnu make \
            libelf-dev libssl-dev perl python3 tar xz-utils unzip

      - name: Download kernel source from Gofile
        env:
          KERNEL_SHARE_URL: https://gofile.io/d/yjgaN3fb
        run: |
          python3 -m pip install --user gallery-dl
          mkdir -p "$RUNNER_TEMP/gofile-source"
          "$HOME/.local/bin/gallery-dl" \
            --destination "$RUNNER_TEMP/gofile-source" \
            "$KERNEL_SHARE_URL"
          find "$RUNNER_TEMP/gofile-source" -type f -printf '%p (%s bytes)\n'

      - name: Unpack source and select kernel tree
        id: source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kernel-unpacked"
          mapfile -t archives < <(find "$RUNNER_TEMP/gofile-source" -type f \
            \( -name '*.tar.gz' -o -name '*.tgz' -o -name '*.tar.xz' \
               -o -name '*.tar.bz2' -o -name '*.zip' \))
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "Expected one kernel source archive from the Gofile link; found ${#archives[@]}"
            exit 1
          fi
          archive="${archives[0]}"
          case "$archive" in
            *.zip) unzip -q "$archive" -d "$RUNNER_TEMP/kernel-unpacked" ;;
            *) tar -xf "$archive" -C "$RUNNER_TEMP/kernel-unpacked" ;;
          esac
          kernel_src=""
          while IFS= read -r makefile; do
            if grep -qE '^VERSION[[:space:]]*=' "$makefile" && \
               grep -qE '^PATCHLEVEL[[:space:]]*=' "$makefile" && \
               grep -qE '^SUBLEVEL[[:space:]]*=' "$makefile"; then
              kernel_src="$(dirname "$makefile")"
              break
            fi
          done < <(find "$RUNNER_TEMP/kernel-unpacked" -type f -name Makefile -print)
          if [ -z "$kernel_src" ]; then
            echo "No Linux kernel source root found in the uploaded archive."
            find "$RUNNER_TEMP/kernel-unpacked" -maxdepth 3 -type f | head -100
            exit 1
          fi
          printf 'KERNEL_SRC=%s\n' "$kernel_src" >> "$GITHUB_ENV"
          echo "Kernel source: $kernel_src"
          rg '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)[[:space:]]*=' "$kernel_src/Makefile" || true

      - name: Configure and compile unmodified TV kernel
        run: |
          set -euo pipefail
          build_dir="$RUNNER_TEMP/kernel-build"
          mkdir -p "$build_dir"
          cp tv-kernel.config "$build_dir/.config"
          make -C "$KERNEL_SRC" O="$build_dir" ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          set +e
          make -C "$KERNEL_SRC" O="$build_dir" ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- -j2 Image modules 2>&1 | tee kernel-build.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "Kernel build exit code: $rc"
          exit "$rc"

      - name: Save build log and outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lg-kernel-build-probe
          path: |
            kernel-build.log
            ${{ runner.temp }}/kernel-build/arch/arm64/boot/Image
          if-no-files-found: warn
          retention-days: 14
