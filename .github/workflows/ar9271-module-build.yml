name: AR9271 ath9k_htc module build

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ar9271-module-build.yml
      - tv-kernel.config
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out build configuration
        uses: actions/checkout@v4

      - name: Install AArch64 kernel build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex gcc-aarch64-linux-gnu make \
            libelf-dev libssl-dev perl python3 tar xz-utils unzip kmod

      - name: Download LG prepared build tree on runner
        env:
          KERNEL_SHARE_URL: https://gofile.io/d/yjgaN3fb
        run: |
          python3 -m pip install --user gallery-dl
          mkdir -p "$RUNNER_TEMP/gofile-source"
          "$HOME/.local/bin/gallery-dl" \
            --destination "$RUNNER_TEMP/gofile-source" \
            "$KERNEL_SHARE_URL"
          find "$RUNNER_TEMP/gofile-source" -type f -printf '%p (%s bytes)\n'

      - name: Unpack LG package and locate prepared output
        run: |
          set -euo pipefail
          unpacked="$RUNNER_TEMP/lg-unpacked"
          mkdir -p "$unpacked"
          mapfile -t archives < <(find "$RUNNER_TEMP/gofile-source" -type f \
            \( -name '*.tar' -o -name '*.tar.gz' -o -name '*.tgz' \
               -o -name '*.tar.xz' -o -name '*.tar.bz2' -o -name '*.zip' \))
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "Expected one LG package archive; found ${#archives[@]}"
            exit 1
          fi
          case "${archives[0]}" in
            *.zip) unzip -q "${archives[0]}" -d "$unpacked" ;;
            *) tar -xf "${archives[0]}" -C "$unpacked" ;;
          esac

          # The Gofile package contains the prepared output in a nested tarball.
          for pass in $(seq 1 10); do
            mapfile -t nested < <(find "$unpacked" -type f \
              \( -name '*.tar' -o -name '*.tar.gz' -o -name '*.tgz' \
                 -o -name '*.tar.xz' -o -name '*.tar.bz2' -o -name '*.zip' \))
            [ "${#nested[@]}" -gt 0 ] || break
            for archive in "${nested[@]}"; do
              case "$archive" in
                *.zip) unzip -q "$archive" -d "$(dirname "$archive")" ;;
                *) tar -xf "$archive" -C "$(dirname "$archive")" ;;
              esac
              mv "$archive" "$archive.extracted"
            done
          done

          mapfile -t build_trees < <(find "$unpacked" -type f -name Module.symvers \
            -printf '%h\n' | while read -r d; do
              [ -f "$d/.config" ] && [ -f "$d/include/config/kernel.release" ] && echo "$d"
            done)
          if [ "${#build_trees[@]}" -ne 1 ]; then
            echo "Expected one prepared LG output tree with Module.symvers and .config; found ${#build_trees[@]}"
            find "$unpacked" -maxdepth 6 \( -name Module.symvers -o -name kernel.release \) -print
            exit 1
          fi
          printf 'KERNEL_BUILD=%s\n' "${build_trees[0]}" >> "$GITHUB_ENV"
          echo "LG prepared release: $(cat "${build_trees[0]}/include/config/kernel.release")"

      - name: Restore complete Linux 4.4.84 source on runner
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fL --retry 3 -o linux-4.4.84.tar.xz \
            https://cdn.kernel.org/pub/linux/kernel/v4.x/linux-4.4.84.tar.xz
          curl -fL --retry 3 -o sha256sums.asc \
            https://cdn.kernel.org/pub/linux/kernel/v4.x/sha256sums.asc
          awk '$2 == "linux-4.4.84.tar.xz" { print $1 "  " $2 }' sha256sums.asc > linux-4.4.84.sha256
          sha256sum -c linux-4.4.84.sha256
          tar -xf linux-4.4.84.tar.xz
          echo "KERNEL_SRC=$RUNNER_TEMP/linux-4.4.84" >> "$GITHUB_ENV"

      - name: Enable and build AR9271 modules only
        run: |
          set -euo pipefail
          # Start with the TV-captured config; retain LG's prepared generated
          # headers and Module.symvers from the O20N build output.
          cp tv-kernel.config "$KERNEL_BUILD/.config"
          scripts="$KERNEL_SRC/scripts/config"
          # Preserve the TV's debugfs support and build relay as a module so
          # ath9k's common spectral helper can resolve its relay API.
          "$scripts" --file "$KERNEL_BUILD/.config" --enable MODULES
          "$scripts" --file "$KERNEL_BUILD/.config" --enable CFG80211
          "$scripts" --file "$KERNEL_BUILD/.config" --enable ATH_CARDS
          # Keep LED triggers off; the TV has no LED trigger exports.
          "$scripts" --file "$KERNEL_BUILD/.config" --disable MAC80211_LEDS
          "$scripts" --file "$KERNEL_BUILD/.config" --disable LEDS_CLASS
          "$scripts" --file "$KERNEL_BUILD/.config" --enable DEBUG_FS
          "$scripts" --file "$KERNEL_BUILD/.config" --module RELAY
          "$scripts" --file "$KERNEL_BUILD/.config" --disable ATH9K_DEBUGFS
          "$scripts" --file "$KERNEL_BUILD/.config" --disable ATH9K_HTC_DEBUGFS
          "$scripts" --file "$KERNEL_BUILD/.config" --enable ATH9K_COMMON_DEBUG
          "$scripts" --file "$KERNEL_BUILD/.config" --module MAC80211
          "$scripts" --file "$KERNEL_BUILD/.config" --module ATH9K_HTC
          "$scripts" --file "$KERNEL_BUILD/.config" --enable USB

          # Avoid ath9k's unconditional selects: LED triggers are absent from
          # the TV kernel, while relay is supplied by the relay.ko built here.
          sed -i \
            -e '/^[[:space:]]*select MAC80211_LEDS/d' \
            -e '/^[[:space:]]*select RELAY/d' \
            "$KERNEL_SRC/drivers/net/wireless/ath/ath9k/Kconfig"

          hostflags='-O2 -fcommon'
          make -C "$KERNEL_SRC" O="$KERNEL_BUILD" ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- HOSTCFLAGS="$hostflags" \
            olddefconfig 2>&1 | tee kernel-build.log
          grep -E '^CONFIG_(CFG80211|MAC80211|MAC80211_LEDS|ATH_CARDS|ATH9K_HTC|ATH9K.*DEBUGFS|ATH9K_COMMON.*|USB|RELAY)=' "$KERNEL_BUILD/.config" || true
          grep -q '^CONFIG_ATH9K_HTC=m$' "$KERNEL_BUILD/.config"
          grep -q '^CONFIG_RELAY=m$' "$KERNEL_BUILD/.config"
          grep -q '^CONFIG_ATH9K_COMMON_DEBUG=y$' "$KERNEL_BUILD/.config"
          if grep -qE '^CONFIG_(MAC80211_LEDS|ATH9K_DEBUGFS|ATH9K_HTC_DEBUGFS)=y$' "$KERNEL_BUILD/.config"; then
            echo "Unsupported LED or ath9k debug options are enabled"
            grep -E '^CONFIG_(MAC80211_LEDS|ATH9K_DEBUGFS|ATH9K_HTC_DEBUGFS)=' "$KERNEL_BUILD/.config"
            exit 1
          fi
          cp "$KERNEL_BUILD/.config" kernel-config.final

          make -C "$KERNEL_SRC" O="$KERNEL_BUILD" ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- HOSTCFLAGS="$hostflags" \
            modules_prepare 2>&1 | tee -a kernel-build.log
          # The LG prepared output contains stale wireless objects built with
          # its original config. Remove only these generated output dirs so
          # Kbuild recompiles the wireless stack against this config/source.
          rm -rf "$KERNEL_BUILD/drivers/net/wireless/ath" \
                 "$KERNEL_BUILD/net/mac80211"
          # Build enabled modules in one Kbuild pass so modpost sees the full
          # mac80211/ath symbol set and writes correct inter-module dependencies.
          make -C "$KERNEL_SRC" O="$KERNEL_BUILD" ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- HOSTCFLAGS="$hostflags" \
            KCFLAGS="-fno-pic -fno-stack-protector" \
            modules 2>&1 | tee -a kernel-build.log
          if grep -q 'WARNING: .*undefined!' kernel-build.log; then
            echo "Module modpost reported unresolved symbols"
            grep 'WARNING: .*undefined!' kernel-build.log
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/ar9271-output/ath9k_htc"
          find "$KERNEL_BUILD" -type f \
            \( -name relay.ko -o -name mac80211.ko -o -name ath.ko -o -name ath9k_hw.ko \
               -o -name ath9k_common.ko -o -name ath9k_htc.ko \) \
            -exec cp '{}' "$RUNNER_TEMP/ar9271-output/" \;
          find "$RUNNER_TEMP/ar9271-output" -name '*.ko' -print -exec sh -c 'echo vermagic:; modinfo -F vermagic "$1"; echo depends:; modinfo -F depends "$1"' sh '{}' \;
          test "$(find "$RUNNER_TEMP/ar9271-output" -name ath9k_htc.ko | wc -l)" -eq 1
          test "$(find "$RUNNER_TEMP/ar9271-output" -name relay.ko | wc -l)" -eq 1

      - name: Fetch AR9271 firmware on runner
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            https://raw.githubusercontent.com/thesofproject/linux-firmware/master/ath9k_htc/htc_9271-1.4.0.fw \
            -o "$RUNNER_TEMP/ar9271-output/ath9k_htc/htc_9271-1.4.0.fw"
          cp "$RUNNER_TEMP/ar9271-output/ath9k_htc/htc_9271-1.4.0.fw" \
            "$RUNNER_TEMP/ar9271-output/ath9k_htc/htc_9271.fw"
          file "$RUNNER_TEMP/ar9271-output/ath9k_htc/htc_9271.fw"

      - name: Save AR9271 build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ar9271-ath9k-htc-probe
          path: |
            kernel-build.log
            kernel-config.final
            ${{ runner.temp }}/ar9271-output
          if-no-files-found: warn
          retention-days: 14
