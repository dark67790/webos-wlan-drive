name: AR9271 ath9k_htc module build

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ar9271-module-build.yml
      - tv-kernel.config
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out build configuration
        uses: actions/checkout@v4

      - name: Install AArch64 kernel build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex gcc-aarch64-linux-gnu make \
            libelf-dev libssl-dev perl python3 tar xz-utils unzip kmod

      - name: Install GCC 8.2 AArch64 cross compiler (Arm GNU-A 8.2-2019.01)
        run: |
          # The TV kernel was built with GCC 8.2.0. Try to use the same major
          # version; if the download fails, keep going with the apt compiler so the
          # rest of the build still runs (the compiler used is printed below).
          cd "$RUNNER_TEMP"
          f=gcc-arm-8.2-2019.01-x86_64-aarch64-linux-gnu.tar.xz
          base=https://developer.arm.com/-/media/Files/downloads/gnu-a/8.2-2019.01
          if curl -fL --retry 3 -o "$f" "$base/$f" || curl -fL --retry 3 -o "$f" "$base/binrel/$f"; then
            sha256sum "$f"
            tar -xf "$f"
            bin="$RUNNER_TEMP/${f%.tar.xz}/bin"
            echo "$bin" >> "$GITHUB_PATH"
            "$bin/aarch64-linux-gnu-gcc" --version | head -1
          else
            echo "::warning::Could not download Arm GCC 8.2; using the apt compiler instead"
            aarch64-linux-gnu-gcc --version | head -1
          fi

      - name: Download LG prepared build tree on runner
        env:
          KERNEL_SHARE_URL: https://gofile.io/d/yjgaN3fb
        run: |
          python3 -m pip install --user gallery-dl
          mkdir -p "$RUNNER_TEMP/gofile-source"
          "$HOME/.local/bin/gallery-dl" \
            --destination "$RUNNER_TEMP/gofile-source" \
            "$KERNEL_SHARE_URL"
          find "$RUNNER_TEMP/gofile-source" -type f -printf '%p (%s bytes)\n'

      - name: Unpack LG package and locate prepared output
        run: |
          set -euo pipefail
          unpacked="$RUNNER_TEMP/lg-unpacked"
          mkdir -p "$unpacked"
          mapfile -t archives < <(find "$RUNNER_TEMP/gofile-source" -type f \
            \( -name '*.tar' -o -name '*.tar.gz' -o -name '*.tgz' \
               -o -name '*.tar.xz' -o -name '*.tar.bz2' -o -name '*.zip' \))
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "Expected one LG package archive; found ${#archives[@]}"
            exit 1
          fi
          case "${archives[0]}" in
            *.zip) unzip -q "${archives[0]}" -d "$unpacked" ;;
            *) tar -xf "${archives[0]}" -C "$unpacked" ;;
          esac

          # The Gofile package contains the prepared output in a nested tarball.
          for pass in $(seq 1 10); do
            mapfile -t nested < <(find "$unpacked" -type f \
              \( -name '*.tar' -o -name '*.tar.gz' -o -name '*.tgz' \
                 -o -name '*.tar.xz' -o -name '*.tar.bz2' -o -name '*.zip' \))
            [ "${#nested[@]}" -gt 0 ] || break
            for archive in "${nested[@]}"; do
              case "$archive" in
                *.zip) unzip -q "$archive" -d "$(dirname "$archive")" ;;
                *) tar -xf "$archive" -C "$(dirname "$archive")" ;;
              esac
              mv "$archive" "$archive.extracted"
            done
          done

          mapfile -t build_trees < <(find "$unpacked" -type f -name Module.symvers \
            -printf '%h\n' | while read -r d; do
              [ -f "$d/.config" ] && [ -f "$d/include/config/kernel.release" ] && echo "$d"
            done)
          if [ "${#build_trees[@]}" -ne 1 ]; then
            echo "Expected one prepared LG output tree with Module.symvers and .config; found ${#build_trees[@]}"
            find "$unpacked" -maxdepth 6 \( -name Module.symvers -o -name kernel.release \) -print
            exit 1
          fi
          printf 'KERNEL_BUILD=%s\n' "${build_trees[0]}" >> "$GITHUB_ENV"
          echo "LG prepared release: $(cat "${build_trees[0]}/include/config/kernel.release")"

      - name: Restore complete Linux 4.4.84 source on runner
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fL --retry 3 -o linux-4.4.84.tar.xz \
            https://cdn.kernel.org/pub/linux/kernel/v4.x/linux-4.4.84.tar.xz
          curl -fL --retry 3 -o sha256sums.asc \
            https://cdn.kernel.org/pub/linux/kernel/v4.x/sha256sums.asc
          awk '$2 == "linux-4.4.84.tar.xz" { print $1 "  " $2 }' sha256sums.asc > linux-4.4.84.sha256
          sha256sum -c linux-4.4.84.sha256
          tar -xf linux-4.4.84.tar.xz
          echo "KERNEL_SRC=$RUNNER_TEMP/linux-4.4.84" >> "$GITHUB_ENV"

      - name: Where does LG differ from vanilla? (information only)
        run: |
          # Earlier run: include/net/{cfg80211,mac80211}.h, linux/{netdevice,skbuff,
          # usb,device,module}.h were byte-identical to vanilla. This lists every
          # other file LG changed or added in the areas this driver touches.
          LG="$KERNEL_BUILD/kernel-source"
          for p in include arch/arm64/include net/wireless net/core drivers/usb/core kernel/module.c; do
            echo "=== $p (files that differ, or exist only in LG)"
            diff -rq "$KERNEL_SRC/$p" "$LG/$p" 2>&1 | grep -v "^Only in $KERNEL_SRC" | head -60 || true
          done

      - name: Enable and build AR9271 modules only
        run: |
          set -euo pipefail
          # Start with the TV-captured config; retain LG's prepared generated
          # headers and Module.symvers from the O20N build output.
          cp tv-kernel.config "$KERNEL_BUILD/.config"
          scripts="$KERNEL_SRC/scripts/config"
          # Build only the USB HTC path without the optional spectral code.
          # This Linux 4.4 tree includes common-spectral.o in ath9k_common,
          # and that object imports relay APIs the TV does not export.
          "$scripts" --file "$KERNEL_BUILD/.config" --enable MODULES
          "$scripts" --file "$KERNEL_BUILD/.config" --enable CFG80211
          "$scripts" --file "$KERNEL_BUILD/.config" --enable ATH_CARDS
          # Keep LED triggers off; the TV has no LED trigger exports.
          "$scripts" --file "$KERNEL_BUILD/.config" --disable MAC80211_LEDS
          "$scripts" --file "$KERNEL_BUILD/.config" --disable LEDS_CLASS
          "$scripts" --file "$KERNEL_BUILD/.config" --enable DEBUG_FS
          "$scripts" --file "$KERNEL_BUILD/.config" --disable ATH9K_DEBUGFS
          "$scripts" --file "$KERNEL_BUILD/.config" --disable ATH9K_HTC_DEBUGFS
          "$scripts" --file "$KERNEL_BUILD/.config" --module MAC80211
          "$scripts" --file "$KERNEL_BUILD/.config" --module ATH9K_HTC
          "$scripts" --file "$KERNEL_BUILD/.config" --enable USB

          # Avoid ath9k's unconditional LED select; the TV kernel has no LED
          # trigger exports. Also remove the 4.4 spectral object from the
          # common module; HTC spectral debugfs is disabled above.
          sed -i \
            -e '/^[[:space:]]*select MAC80211_LEDS/d' \
            "$KERNEL_SRC/drivers/net/wireless/ath/ath9k/Kconfig"
          sed -i '/common-spectral\.o/d' \
            "$KERNEL_SRC/drivers/net/wireless/ath/ath9k/Makefile"
          if grep -q 'common-spectral\.o' \
              "$KERNEL_SRC/drivers/net/wireless/ath/ath9k/Makefile"; then
            echo "Spectral object was not removed from ath9k_common"
            exit 1
          fi
          python3 - <<'PYCODE'
          import os
          import re
          from pathlib import Path

          ath9k = Path(os.environ["KERNEL_SRC"]) / "drivers/net/wireless/ath/ath9k"
          replacements = {
              "htc_drv_main.c": (
                  re.compile(
                      r"\t/\* perform spectral scan if requested\. \*/\n"
                      r"\tif \(test_bit\(ATH_OP_SCANNING, &common->op_flags\) &&\n"
                      r"\s+priv->spec_priv\.spectral_mode == SPECTRAL_CHANSCAN\)\n"
                      r"\t\tath9k_cmn_spectral_scan_trigger\(common, &priv->spec_priv\);"
                  ),
                  "\t/* Spectral scanning is omitted in this relay-free build. */",
              ),
              "htc_drv_txrx.c": (
                  re.compile(
                      r"\t\tif \(ath_cmn_process_fft\(&priv->spec_priv, hdr,\n"
                      r"\s+&rx_stats, rx_status->mactime\)\) \{\n"
                      r"\s+/\* TODO: Code to collect spectral scan statistics \*/\n"
                      r"\t\t\}"
                  ),
                  "\t\t/* Drop PHY error frames; FFT parsing is omitted. */",
              ),
          }
          for name, (pattern, replacement) in replacements.items():
              path = ath9k / name
              text = path.read_text()
              updated, count = pattern.subn(replacement, text)
              if count != 1:
                  raise SystemExit(f"Expected one spectral call block in {name}, found {count}")
              path.write_text(updated)
          PYCODE
          if grep -nE 'ath9k_cmn_spectral_scan_trigger|ath_cmn_process_fft' \
              "$KERNEL_SRC/drivers/net/wireless/ath/ath9k/htc_drv_main.c" \
              "$KERNEL_SRC/drivers/net/wireless/ath/ath9k/htc_drv_txrx.c"; then
            echo "HTC sources still reference spectral helpers"
            exit 1
          fi

          # LG's kernel gets CONFIG_PINCTRL and CONFIG_WIRELESS_EXT switched on by
          # LG-only options that do not exist in vanilla Kconfig, so olddefconfig
          # silently turned them OFF. Both change struct layouts in the headers:
          #   PINCTRL       -> struct device gets/loses its 'pins' pointer, and
          #                    struct device is embedded in wiphy, net_device,
          #                    usb_device and usb_interface
          #   WIRELESS_EXT  -> struct net_device gets/loses wireless_handlers and
          #                    wireless_data, right before netdev_ops
          # The TV kernel has no CONFIG_MODVERSIONS, so nothing catches the mismatch
          # at load time. Make vanilla Kconfig keep both on, like the TV.
          sed -i '/^config PINCTRL$/{n;s/^\tbool$/\tdef_bool y/}' \
            "$KERNEL_SRC/drivers/pinctrl/Kconfig"
          sed -i '/^config WIRELESS_EXT$/{n;s/^\tbool$/\tdef_bool y/}' \
            "$KERNEL_SRC/net/wireless/Kconfig"
          grep -A1 '^config PINCTRL$' "$KERNEL_SRC/drivers/pinctrl/Kconfig"
          grep -A1 '^config WIRELESS_EXT$' "$KERNEL_SRC/net/wireless/Kconfig"

          aarch64-linux-gnu-gcc --version | head -1
          hostflags='-O2 -fcommon'
          make -C "$KERNEL_SRC" O="$KERNEL_BUILD" ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- HOSTCFLAGS="$hostflags" \
            olddefconfig 2>&1 | tee kernel-build.log
          grep -E '^CONFIG_(CFG80211|MAC80211|MAC80211_LEDS|ATH_CARDS|ATH9K_HTC|ATH9K.*DEBUGFS|ATH9K_COMMON.*|USB|RELAY)=' "$KERNEL_BUILD/.config" || true
          grep -q '^CONFIG_ATH9K_HTC=m$' "$KERNEL_BUILD/.config"

          # Config-drift report: every option whose value differs from the TV.
          norm() { grep -E '^(CONFIG_|# CONFIG_)' "$1" | sed -E 's/^# (CONFIG_[A-Za-z0-9_]+) is not set$/\1=n/' | sort; }
          norm tv-kernel.config > "$RUNNER_TEMP/tv.norm"
          norm "$KERNEL_BUILD/.config" > "$RUNNER_TEMP/new.norm"
          echo "== options only in the TV config (LG-only or dropped by vanilla Kconfig) =="
          comm -23 <(cut -d= -f1 "$RUNNER_TEMP/tv.norm" | sort -u) \
                   <(cut -d= -f1 "$RUNNER_TEMP/new.norm" | sort -u) | tr '\n' ' '; echo
          echo "== options present in both whose value changed (TV=new) =="
          join -t= -j1 <(LC_ALL=C sort -t= -k1,1 "$RUNNER_TEMP/tv.norm") \
                       <(LC_ALL=C sort -t= -k1,1 "$RUNNER_TEMP/new.norm") | awk -F= '$2!=$3'
          # These three must match the TV or the module ABI is wrong.
          for sym in PINCTRL WIRELESS_EXT WEXT_CORE; do
            if ! grep -q "^CONFIG_${sym}=y$" "$KERNEL_BUILD/.config"; then
              echo "CONFIG_${sym} is not =y; struct layouts would not match the TV"
              exit 1
            fi
          done
          if grep -qE '^CONFIG_ATH9K_HTC_DEBUGFS=(y|m)$' "$KERNEL_BUILD/.config"; then
            echo "HTC spectral debugfs must remain disabled"
            grep -E '^CONFIG_ATH9K_HTC_DEBUGFS=' "$KERNEL_BUILD/.config"
            exit 1
          fi
          if grep -qE '^CONFIG_(MAC80211_LEDS|ATH9K_DEBUGFS)=y$' "$KERNEL_BUILD/.config"; then
            echo "Unsupported LED or PCI ath9k debug options are enabled"
            grep -E '^CONFIG_(MAC80211_LEDS|ATH9K_DEBUGFS)=' "$KERNEL_BUILD/.config"
            exit 1
          fi
          cp "$KERNEL_BUILD/.config" kernel-config.final

          make -C "$KERNEL_SRC" O="$KERNEL_BUILD" ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- HOSTCFLAGS="$hostflags" \
            modules_prepare 2>&1 | tee -a kernel-build.log
          # The LG prepared output contains stale wireless objects built with
          # its original config. Remove only these generated output dirs so
          # Kbuild recompiles the wireless stack against this config/source.
          rm -rf "$KERNEL_BUILD/drivers/net/wireless/ath" \
                 "$KERNEL_BUILD/net/mac80211"
          # Build enabled modules in one Kbuild pass so modpost sees the full
          # mac80211/ath symbol set and writes correct inter-module dependencies.
          make -C "$KERNEL_SRC" O="$KERNEL_BUILD" ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- HOSTCFLAGS="$hostflags" \
            KCFLAGS="-fno-pic -fno-stack-protector" \
            modules 2>&1 | tee -a kernel-build.log
          if grep -q 'WARNING: .*undefined!' kernel-build.log; then
            echo "Module modpost reported unresolved symbols"
            grep 'WARNING: .*undefined!' kernel-build.log
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/ar9271-output/ath9k_htc"
          find "$KERNEL_BUILD" -type f \
            \( -name mac80211.ko -o -name ath.ko -o -name ath9k_hw.ko \
               -o -name ath9k_common.ko -o -name ath9k_htc.ko \) \
            -exec cp '{}' "$RUNNER_TEMP/ar9271-output/" \;
          # The TV kernel has no CCM/GCM (CONFIG_CRYPTO_CCM/GCM are not set) but
          # mac80211 needs them for WPA2-CCMP/GCMP. Collect them in a separate
          # folder; load them only after the five modules above work.
          mkdir -p "$RUNNER_TEMP/ar9271-output/crypto-extra"
          find "$KERNEL_BUILD" -type f \
            \( -name ccm.ko -o -name ctr.ko -o -name gcm.ko -o -name ghash-generic.ko \
               -o -name gf128mul.ko -o -name seqiv.ko \) \
            -exec cp '{}' "$RUNNER_TEMP/ar9271-output/crypto-extra/" \;
          ls -l "$RUNNER_TEMP/ar9271-output/crypto-extra"
          find "$RUNNER_TEMP/ar9271-output" -name '*.ko' -print -exec sh -c 'echo vermagic:; modinfo -F vermagic "$1"; echo depends:; modinfo -F depends "$1"' sh '{}' \;
          test "$(find "$RUNNER_TEMP/ar9271-output" -name ath9k_htc.ko | wc -l)" -eq 1
          test "$(find "$RUNNER_TEMP/ar9271-output" -name relay.ko | wc -l)" -eq 0
          if find "$RUNNER_TEMP/ar9271-output" -name '*.ko' -exec modinfo -F depends '{}' \; | grep -qw relay; then
            echo "A WLAN module unexpectedly depends on relay"
            exit 1
          fi
          if aarch64-linux-gnu-nm -u "$RUNNER_TEMP/ar9271-output"/*.ko | grep -Eq '[[:space:]](relay_[[:alnum:]_]+|ath9k_cmn_spectral_[[:alnum:]_]+|ath_cmn_process_fft)'; then
            echo "A WLAN module imports relay or omitted spectral symbols"
            aarch64-linux-gnu-nm -u "$RUNNER_TEMP/ar9271-output"/*.ko | grep -E '[[:space:]](relay_[[:alnum:]_]+|ath9k_cmn_spectral_[[:alnum:]_]+|ath_cmn_process_fft)'
            exit 1
          fi

      - name: Fetch AR9271 firmware on runner
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            https://raw.githubusercontent.com/thesofproject/linux-firmware/master/ath9k_htc/htc_9271-1.4.0.fw \
            -o "$RUNNER_TEMP/ar9271-output/ath9k_htc/htc_9271-1.4.0.fw"
          cp "$RUNNER_TEMP/ar9271-output/ath9k_htc/htc_9271-1.4.0.fw" \
            "$RUNNER_TEMP/ar9271-output/ath9k_htc/htc_9271.fw"
          file "$RUNNER_TEMP/ar9271-output/ath9k_htc/htc_9271.fw"

      - name: Save AR9271 build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ar9271-ath9k-htc-probe
          path: |
            kernel-build.log
            kernel-config.final
            ${{ runner.temp }}/ar9271-output
          if-no-files-found: warn
          retention-days: 14
